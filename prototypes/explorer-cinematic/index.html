<meta charset="utf-8">
<title>Panoptes Observatory</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
/* Layout: full-bleed instrument canvas; HUD floats in a gutter frame (tabs + status top, controls left, inspector right, time rail bottom).
   Single committed dark world (an observatory at night), so no light theme. */
:root{
  --bg:#040506; --ink:#dfe5e8; --dim:#7d888e; --faint:#3a4348; --rule:rgba(150,172,184,.16);
  --panel:rgba(6,9,11,.80); --acc:#9fe6ff; --amber:#ffb45e; --ok:#86ffad; --warn:#ff5d6c; --violet:#c49bff;
  --f-display:"Cormorant Garamond","Times New Roman",serif;
  --f-body:"IBM Plex Sans",system-ui,sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden}
body{font-family:var(--f-body);font-size:13px}
#app{position:fixed;inset:0}
canvas.layer{position:absolute;inset:0;width:100%;height:100%;display:block}
#c2{pointer-events:auto}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-140%);font:500 10px/1.2 var(--f-data);letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink);background:rgba(4,5,6,.72);border:1px solid var(--rule);padding:2px 6px;white-space:nowrap}
.lbl.fixed{transform:translate(0,-50%);background:none;border:none;color:var(--dim)}
.lbl.solid{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lbl.warn{color:var(--warn);border-color:rgba(255,93,108,.4)}
#tip{position:absolute;pointer-events:none;font:500 10px/1.3 var(--f-data);color:var(--bg);background:var(--ink);padding:2px 6px;
  text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
#hud{position:absolute;inset:0;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  display:grid;grid-template-rows:auto auto 1fr auto;grid-template-columns:minmax(0,280px) 1fr minmax(0,300px);gap:8px 16px}
#hud>*{pointer-events:auto}
header{grid-column:1/-1;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--rule);padding-bottom:6px;min-width:0}
.brand{font:500 11px var(--f-data);letter-spacing:.32em;color:var(--ink);white-space:nowrap}
.brand b{font-weight:500;color:var(--dim)}
nav{display:flex;gap:2px;overflow-x:auto;min-width:0;flex:1;scrollbar-width:none}
nav a{font:500 11px var(--f-data);letter-spacing:.1em;color:var(--dim);text-decoration:none;padding:5px 10px;border:1px solid transparent;white-space:nowrap}
nav a:hover{color:var(--ink)}
nav a[aria-current="page"]{color:var(--ink);border-color:var(--rule);background:rgba(255,255,255,.03)}
nav a kbd{font:inherit;color:var(--faint);margin-right:6px}
.chip{font:500 10px var(--f-data);letter-spacing:.12em;text-transform:uppercase;border:1px solid currentColor;padding:2px 6px;white-space:nowrap}
.chip.syn{color:var(--amber)}
.toggles{display:none;gap:6px}
#status{grid-column:1/-1;font:400 10.5px/1.5 var(--f-data);letter-spacing:.1em;color:var(--dim);text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
#status em{font-style:normal;color:var(--ink)}
.panel{background:var(--panel);border:1px solid var(--rule);backdrop-filter:blur(6px);overflow-y:auto;min-width:0;max-height:100%;
  padding:12px;display:flex;flex-direction:column;gap:12px;align-self:start}
#left{grid-column:1;grid-row:3}
#right{grid-column:3;grid-row:3}
.panel h2{font:500 10px var(--f-data);letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin:0;display:flex;justify-content:space-between;gap:8px}
.panel p{margin:0;line-height:1.5;color:var(--ink)}
.panel p.note{color:var(--dim);font-size:12px}
.seg{display:flex;flex-wrap:wrap;gap:4px}
button{font:500 10.5px var(--f-data);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);background:transparent;
  border:1px solid var(--rule);padding:6px 9px;cursor:pointer}
button:hover{color:var(--ink);border-color:var(--faint)}
button[aria-pressed="true"]{color:var(--bg);background:var(--ink);border-color:var(--ink)}
button:focus-visible,nav a:focus-visible,input:focus-visible,select:focus-visible{outline:1px solid var(--acc);outline-offset:2px}
.kv{display:grid;grid-template-columns:minmax(0,38%) minmax(0,1fr);gap:3px 10px;font:400 11px/1.45 var(--f-data)}
.kv dt{overflow-wrap:anywhere;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.kv dd{margin:0;color:var(--ink);overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.unk{color:var(--warn);letter-spacing:.1em}
.cls{display:inline-block;width:8px;height:8px;margin-right:6px;vertical-align:0}
.idl{color:var(--acc);cursor:pointer;text-decoration:underline dotted;background:none;border:none;padding:0;font:inherit;letter-spacing:0;text-transform:none}
.big{font:500 22px var(--f-data);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.verdict{font:500 11px var(--f-data);letter-spacing:.14em;padding:6px 8px;border:1px solid currentColor;text-transform:uppercase}
.verdict.inc{color:var(--amber)} .verdict.ok{color:var(--ok)} .verdict.no{color:var(--warn)}
.legend{display:grid;gap:4px;font:400 10.5px var(--f-data);color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
footer{grid-column:1/-1;grid-row:4;display:flex;align-items:center;gap:12px;border-top:1px solid var(--rule);padding-top:8px;min-width:0}
footer[hidden]{display:none!important}
#scrub{flex:1;min-width:80px;accent-color:var(--acc)}
.rail{position:relative;flex:1;min-width:80px;display:flex;flex-direction:column;gap:4px}
#strip{width:100%;height:30px;display:block}
#readout{font:500 11px var(--f-data);letter-spacing:.08em;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums;min-width:150px}
#ds{max-width:230px;text-overflow:ellipsis}
select{font:500 10.5px var(--f-data);background:var(--bg);color:var(--ink);border:1px solid var(--rule);padding:5px}
#intro{position:absolute;inset:0;background:var(--bg);display:grid;place-items:center;z-index:5;transition:opacity 1.1s ease;cursor:pointer}
#intro.gone{opacity:0;pointer-events:none}
.ttl{display:grid;gap:10px;justify-items:center;text-align:center;padding-inline:16px}
.ttl .rule{width:min(560px,80vw);display:flex;justify-content:space-between;font:500 9.5px var(--f-data);letter-spacing:.25em;color:var(--dim);border-top:1px solid var(--faint);padding-top:6px}
.ttl h1{font:500 clamp(42px,9vw,104px)/1 var(--f-display);letter-spacing:.32em;margin:0 0 0 .32em;color:var(--ink);text-shadow:0 0 30px rgba(159,230,255,.25)}
.ttl .rule.b{border-top:none;border-bottom:1px solid var(--faint);padding:0 0 6px}
.ttl small{font:400 10px var(--f-data);letter-spacing:.2em;color:var(--faint);text-transform:uppercase}
#err{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:500 12px var(--f-data);color:var(--warn);text-align:center;max-width:420px;line-height:1.6}
#cap{position:absolute;left:50%;bottom:max(84px,calc(env(safe-area-inset-bottom,0px) + 84px));transform:translateX(-50%);z-index:4;pointer-events:none;
  display:grid;gap:6px;justify-items:center;text-align:center;width:min(760px,calc(100% - 32px))}
#cap .eye{font:500 10px var(--f-data);letter-spacing:.28em;color:var(--acc);text-transform:uppercase}
#cap .line{font:500 clamp(18px,2.6vw,28px)/1.25 var(--f-display);letter-spacing:.04em;color:var(--ink);text-shadow:0 0 18px rgba(4,5,6,.9)}
#cap .bar{width:100%;height:1px;background:var(--faint);position:relative}
#cap .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--acc)}
#tourBtn[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--bg)}
input[type=range]{accent-color:var(--acc)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;font:400 11px var(--f-data);color:var(--dim)}
.src{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px;align-items:center;font:400 11px var(--f-data)}
.src span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars{display:grid;gap:3px}
.bars div{display:grid;grid-template-columns:28px 1fr 44px;gap:6px;align-items:center;font:400 10.5px var(--f-data);color:var(--dim)}
.bars b{display:block;height:6px;background:var(--acc)}
pre.man{font:400 10.5px/1.5 var(--f-data);color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere;margin:0;max-height:220px;overflow:auto;border:1px solid var(--rule);padding:8px}
#center{grid-column:2;grid-row:3;align-self:stretch;min-height:0;font:400 12px/1.5 var(--f-body)}
#center h3{font:500 10px var(--f-data);letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin:6px 0 0}
#center .hdr{font:400 11px/1.55 var(--f-data);color:var(--dim)} #center .hdr em{font-style:normal;color:var(--ink)}
.smgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.sm{display:block;text-align:left;text-transform:none;letter-spacing:0;padding:8px;border:1px solid var(--rule);background:rgba(255,255,255,.02);color:var(--ink);font:400 11px/1.4 var(--f-data)}
.sm:hover{border-color:var(--faint)} .sm[aria-pressed="true"]{background:rgba(159,230,255,.08);border-color:var(--acc);color:var(--ink)}
.sm.dim{opacity:.55} .sm .nm{font:500 10.5px var(--f-data);letter-spacing:.1em;text-transform:uppercase;display:flex;justify-content:space-between;gap:8px}
.sm .eff{color:var(--amber)} .sm .mut{color:var(--dim);font-size:10.5px}
.sm svg{display:block;width:100%;height:auto;margin:4px 0}
.sm .dot{fill:var(--ink)} .sm .lb{stroke:var(--amber);stroke-width:1.6} .sm .la{stroke:var(--acc);stroke-width:1.6}
.sm .cd{stroke:var(--violet);stroke-width:1;stroke-dasharray:3 3} .sm .ax{stroke:var(--rule)} .sm text{font:400 8.5px var(--f-data);fill:var(--dim)}
.sm .gap{fill:url(#hatch);stroke:var(--warn);stroke-opacity:.35;stroke-width:.5}
.card{border:1px solid var(--rule);padding:10px 12px;display:grid;gap:7px;background:rgba(255,255,255,.02)}
.card.sens{border-color:var(--violet);background:rgba(196,155,255,.06)}
.card .t{font:500 15px var(--f-display);letter-spacing:.02em}
.card ul{margin:0;padding-left:16px;color:var(--ink)} .card li{margin:1px 0}
.card .lbl2{font:500 9.5px var(--f-data);letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.badge{display:inline-block;font:500 9.5px var(--f-data);letter-spacing:.1em;text-transform:uppercase;border:1px solid currentColor;padding:1px 5px;margin-right:4px}
.badge.sens{color:var(--violet)} .badge.gated,.badge.unproven,.badge.partly_unproven{color:var(--amber)} .badge.ok{color:var(--ok)} .badge.opt{color:var(--acc)}
.cands{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.dtgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr))}
.dtcv{display:block;width:100%;height:320px;border:1px solid var(--rule);background:rgba(255,255,255,.015);cursor:pointer}
.dtwrap{position:relative;padding-top:2px;overflow:hidden;flex-shrink:0}
.dtmk{position:relative;height:17px;font:400 10px/17px var(--f-data);color:var(--ink);white-space:nowrap}
.dtmk i{position:absolute;top:2px;width:0;height:0;margin-left:-4px;border:4px solid transparent;border-top:7px solid var(--violet);border-bottom:0}
.dtmk span{position:absolute;top:0}
.dtcal{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:1px;height:34px}
.dtcal button{padding:0;margin:0;min-width:0;height:100%;border:0;border-radius:0;background:#2a3338;cursor:pointer}
.dtcal button.un{background:repeating-linear-gradient(45deg,rgba(255,93,108,.6) 0 1px,transparent 1px 4px),#161c1f}
.dtcal button[aria-pressed="true"]{outline:2px solid #fff;outline-offset:-2px}
.dtcal button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.dtwrap b{position:absolute;bottom:0;height:calc(100% - 2px);width:0;border-left:1px dashed var(--violet);pointer-events:none}
.dtax{display:flex;justify-content:space-between;font:400 10px var(--f-data);color:var(--dim)}
.dtcard.muted{opacity:.62} .dtcard.sel{background:rgba(159,230,255,.07);outline:1px solid var(--acc)}
.dtsel{display:block;width:100%;text-align:left;text-transform:none;letter-spacing:0;border:0;background:none;padding:0;color:var(--ink);font:400 12px var(--f-data)}
.dtsel .t{font:500 18px var(--f-display)} .mut{color:var(--dim)}
.dtpl{list-style:none;margin:0;padding:0;display:grid;gap:3px;font:400 11.5px/1.4 var(--f-data)}
.dtar{display:inline-block;width:14px;font-size:9px} .dtar.up{color:var(--amber)} .dtar.dn{color:var(--acc)}
.dtsr{position:absolute;left:-9999px}
.lmck{list-style:none;margin:0;padding:0;font:400 10.5px/1.45 var(--f-data)}
.lmck li{display:grid;grid-template-columns:14px 1fr;gap:4px;padding:3px 0;border-bottom:1px solid var(--rule)}
.lmck li>span:first-child{font-weight:600}.lmck .ok,.lmck li.ok>span:first-child{color:var(--ok)}.lmck .bad,.lmck li.bad>span:first-child{color:var(--warn)}
.lmck .warn,.lmck li.warn>span:first-child{color:var(--amber)}.lmck li.info>span:first-child{color:var(--acc)}
span.lmck{font:inherit}
.lmtr{display:flex;flex-direction:column;gap:2px}.lmtr .lbl2{font:500 9.5px var(--f-data);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-top:6px}
.lmst{text-align:left;text-transform:none;letter-spacing:0;white-space:normal;overflow-wrap:anywhere;padding:4px 6px;font:400 10.5px/1.35 var(--f-data)}
.lmst[aria-pressed="true"]{border-color:var(--acc);color:var(--acc)}
.lmsm{list-style:none;margin:4px 0;padding:0;font:400 10px/1.4 var(--f-data);overflow-wrap:anywhere}.lmsm li{padding:3px 0;border-bottom:1px solid var(--rule)}.lmsm .mut{color:var(--dim)}
.lmlab{display:flex;flex-direction:column;gap:4px;font:500 9.5px var(--f-data);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}.lmlab select{width:100%;text-transform:none;letter-spacing:0}
.lmgo{border-color:var(--acc);background:rgba(159,230,255,.06);margin-top:10px}
.dtmir{display:block;width:100%;text-align:left;text-transform:none;letter-spacing:0;white-space:normal;padding:6px 8px;border:1px solid var(--violet);background:rgba(196,155,255,.06);color:var(--ink);font:400 11px/1.4 var(--f-data);margin-top:4px}
.dtcall{white-space:normal}
.dtsil{width:100%;height:auto;display:block} .dtsil rect{fill:var(--faint)} .dtsil rect.on{fill:var(--acc)} .dtsil text{font:400 8.5px var(--f-data);fill:var(--dim)} .dtsil .v{fill:var(--ink)}
.dtsil .ax{stroke:var(--rule)} .dtsil .thr{stroke:var(--amber);stroke-dasharray:3 3}
@media (max-width:560px){.dtcv{height:300px}}
@media (max-width:820px){
  #center{grid-column:1}
  #cap{bottom:110px}
  header{flex-wrap:wrap;row-gap:6px}
  nav{order:3;flex-basis:100%}
  footer{flex-wrap:wrap;row-gap:6px}
  .rail{order:-1;flex-basis:100%}
  #hud{grid-template-columns:1fr;grid-template-rows:auto auto 1fr auto}
  .brand b,.chip.syn{display:none}
  .toggles{display:flex}
  #left,#right{grid-column:1;grid-row:3;max-height:62vh;display:none}
  #left.open,#right.open{display:flex}
  #readout{min-width:0}
}
@media (prefers-reduced-motion:reduce){#intro{transition:none}}
</style>

  <canvas class="layer" id="gl"></canvas>

      <div class="brand">PANOPTES <b>/ LAPLACE</b></div>

        <a href="#shifts" data-lens="shifts"><kbd>2</kbd>Shifts</a>

      <select id="ds" aria-label="Workspace"><option value="persona">EX-01 persona</option><option value="fixtures">Fixture export</option></select>

    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
/* ============ utilities ============ */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let rnd=mulberry(20260302);
function gauss(r=rnd){let u=0,v=0;while(!u)u=r();while(!v)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hex=h=>[parseInt(h.slice(1,3),16)/255,parseInt(h.slice(3,5),16)/255,parseInt(h.slice(5,7),16)/255];
const REDUCED=matchMedia("(prefers-reduced-motion: reduce)").matches;
const MS_DAY=864e5; let BASE_UTC=Date.UTC(2026,2,2);
const DOW=["MON","TUE","WED","THU","FRI","SAT","SUN"];
function dateOf(d){return new Date(BASE_UTC+d*MS_DAY).toISOString().slice(0,10)}
function wdIdx(d){return (new Date(BASE_UTC+d*MS_DAY).getUTCDay()+6)%7}
function dowName(d){return DOW[wdIdx(d)]}
function dayIdx(s){return Math.round((Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10))-BASE_UTC)/MS_DAY)}

const CLASS_COL={observation:"#b9c6cf",normalized_event:"#6fd0ff",hypothesis:"#c49bff",inference:"#ffc860",prediction:"#ff7a5a"};
const HUB_COL={"src-location":"#6fd0ff","src-motion":"#86ffad","src-healthkit":"#ff7a9a","src-eventkit":"#ffd36e","src-apr":"#b48cff","src-account-export":"#ff9f5a","src-workspace":"#ffffff","src-screentime":"#7be0c3","src-messaging-export":"#ff8ad8","src-weather":"#a8b8c8"};
const EDGE_COL={VISITED:"#6fd0ff",AT_PLACE:"#6fd0ff",CORROBORATED_BY:"#86ffad",ACCESSED_BY:"#b48cff",CONTACTED:"#b48cff",USES:"#b48cff",
  CONFIRMS:"#ffd36e",SUPPORTED_BY:"#ffc860",EVIDENCE:"#ffc860",CONTRADICTED_BY:"#ff5d6c",DUPLICATE_OF:"#ff9f5a",CORRECTS:"#ffffff",MOTIVATED_BY:"#c49bff"};

function buildModel(){

  const w0=D.meta.window.start;BASE_UTC=Date.UTC(+w0.slice(0,4),+w0.slice(5,7)-1,+w0.slice(8,10));
  const mz=/([+-])(\d\d):(\d\d)$/.exec(D.meta.window.start);TZOFF=mz?(mz[1]==="-"?-1:1)*(+mz[2]*60+ +mz[3])*60000:0;
  NODES=R.filter(r=>r.type!=="Link");NODES.forEach((r,i)=>NIDX[r.id]=i);
  HUBS=[...new Set(NODES.map(r=>r.source_id))].sort((a,b)=>(a==="src-workspace")-(b==="src-workspace"));
  FINDINGS=NODES.filter(r=>r.type==="Finding");UEND=WD+Math.max(1.4,.6+.15*FINDINGS.length);
  NODES.forEach(r=>{
    r._t=tday(startOf(r))??tday(r.event_end);r._te=tday(r.event_end)??r._t;
    if(ENTITY.has(r.type))r._birth=-1;
    else if(r.type==="Finding")r._birth=WD+.3+FINDINGS.indexOf(r)*0.15;
    else if(r.type==="Correction")r._birth=WD+1;
    else r._birth=r._t==null?-1:r._t;
    r._hub=HUBS.indexOf(r.source_id);
  });
  const seen=new Set();
  function add(a,b,type){
    if(!(a in NIDX)||!(b in NIDX)||a===b)return;
    const k=a<b?a+"|"+b:b+"|"+a;if(seen.has(k))return;seen.add(k);
    const i=NIDX[a],j=NIDX[b];
    EDGES.push({i,j,type,birth:Math.max(NODES[i]._birth,NODES[j]._birth),ph:rnd()});
  }
  R.filter(r=>r.type==="Link").forEach(l=>add(l.from,l.to,l.link_type));
  NODES.forEach(r=>{
    if(r.place_id)add(r.id,r.place_id,"AT_PLACE");
    if(r.from_place_id)add(r.id,r.from_place_id,"AT_PLACE");
    if(r.to_place_id)add(r.id,r.to_place_id,"AT_PLACE");
    if(r.app_id)add(r.id,r.app_id,"USES");
    if(r.domain_id)add(r.id,r.domain_id,"CONTACTED");
    if(r.endpoint_domain_id)add(r.id,r.endpoint_domain_id,"CONTACTED");
    (r.supporting_evidence_ids||[]).forEach(e=>add(r.id,e,"EVIDENCE"));
    (r.contradicting_evidence_ids||[]).forEach(e=>add(r.id,e,"CONTRADICTED_BY"));
    (r.motivated_by_ids||[]).forEach(e=>add(r.id,e,"MOTIVATED_BY"));
    if(r.target_id)add(r.id,r.target_id,"CORRECTS");
  });
  ADJ=NODES.map(()=>[]);
  EDGES.forEach((e,k)=>{ADJ[e.i].push(k);ADJ[e.j].push(k)});
}

      if(r.type==="ImportBatch"){set(i,[g()*2,-34-ib*7.5,-6+ib*2.2],null,3);ib++;return}
      if(r.type==="Finding"){const a=fi*1.7;set(i,[Math.cos(a)*7,10+fi*2.5,Math.sin(a)*7],null,4.5);fi++;return}

    });

    const ord=NODES.map((r,i)=>i).sort((a,b)=>((NODES[a]._t??-99)-(NODES[b]._t??-99))||a-b);

let FEAT=[];
const TR_CAND=[["late_night_minutes","late-night min"],["sleep_duration","sleep min"],["steps","steps"],["screen_minutes","screen min"]];

function trainPlan(){

  const N=NDAYS,ser={};
  TR_CAND.forEach(([m])=>{ser[m]=[...Array(N)].map((_,d)=>mval(m,d))});
  const known=m=>ser[m].filter(v=>v!=null).length,ln=ser.late_night_minutes;
  if(known("late_night_minutes")<20)return{why:"has late_night_minutes on only "+known("late_night_minutes")+" of "+N+" days (at least 20 needed). Unknown days are not counted as zero, so there is nothing honest to predict"};

function dz(a,b){let s=0,n=0;for(let j=0;j<a.length;j++)if(a[j]!=null&&b[j]!=null){s+=(a[j]-b[j])**2;n++}return n?s*a.length/n:0}

function cascadeFrom(roots){

    if(r.type==="Source")NODES.forEach((x,j)=>{if(x.source_id===r.id&&j!==i)kids.push(j)});
    if(r.type==="ImportBatch")NODES.forEach((x,j)=>{if(x.import_batch_id===r.id)kids.push(j)});
    FINDINGS.forEach(f=>{if([].concat(f.supporting_evidence_ids||[],f.contradicting_evidence_ids||[],f.motivated_by_ids||[]).includes(r.id))kids.push(NIDX[f.id])});
    NODES.forEach((x,j)=>{if(x.type==="Correction"&&x.target_id===r.id)kids.push(j)});
    kids.forEach(j=>{if(!dep.has(j)&&!ctl.dead.has(j)){dep.set(j,d+1);q.push(j)}});

async function buildManifest(){
  const keep=NODES.filter((r,i)=>!ctl.dead.has(i)&&!(ctl.paused[r.source_id]!=null&&r._birth>ctl.paused[r.source_id]));
  const recs=keep.map(r=>{const o={};Object.keys(r).filter(k=>k[0]!=="_").sort().forEach(k=>o[k]=r[k]);return o}).sort((a,b)=>a.id<b.id?-1:1);
  const body=JSON.stringify(recs);let digest="unavailable in this browser";
  try{const h=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(body));digest=[...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,"0")).join("")}catch(e){}
  const tc={};recs.forEach(r=>tc[r.type]=(tc[r.type]||0)+1);
  ctl.manifest={workspace_id:D.meta.workspace_id,contract_version:D.meta.contract_version,synthetic:true,record_count:recs.length,
    excluded_deleted:[...ctl.dead.keys()].length,paused_sources:Object.keys(ctl.paused),type_counts:tc,content_sha256:digest,
    note:"Preview only. Real V1 exports are participant-initiated encrypted batches; the package format is still provisional."};
  showManifest();
}

  }else if(f.finding_kind==="day_type_trend"){

    R_.push(kvr("best k",esc(f.best_k)),kvr("best silhouette",f.best_silhouette!=null?fmtN(f.best_silhouette)+" (threshold "+DT_THR+")":"—"),kvr("classified days",esc(f.n_classified_days)),kvr("reason",esc(f.reason||"")));

/* --- Shifts --- */
function shiftSvg(m,f){
  const W=300,H=116,pl=8,pr=8,pt=8,pb=16,bw=(W-pl-pr)/NDAYS,xd=d=>pl+(d+.5)*bw,vals=[...Array(NDAYS)].map((_,d)=>mval(m,d)),known=vals.filter(v=>v!=null);
  const c=f?(f.statistic_center||"median"):null;
  const lv=f?[f.baseline&&f.baseline[c],f.after&&f.after[c]].filter(v=>typeof v==="number"):[];
  let lo=Math.min(...known,...lv),hi=Math.max(...known,...lv);if(!known.length){lo=0;hi=1}const span=(hi-lo)||1;lo-=span*.1;hi+=span*.1;
  const yv=v=>pt+(1-(v-lo)/(hi-lo))*(H-pt-pb);
  let g=`<line class="ax" x1="${pl}" y1="${H-pb}" x2="${W-pr}" y2="${H-pb}"/>`;
for(let d=0;d<NDAYS;d++)if(vals[d]==null)g+=`<rect class="gap" fill="url(#hatch)" x="${(xd(d)-bw/2).toFixed(1)}" y="${pt}" width="${bw.toFixed(1)}" height="${H-pt-pb}"/>`;
  if(f){
    const seg=(w,v,cls)=>{if(!w||typeof v!=="number")return"";const x0=xd(clamp(dayIdx(w.start),0,NDAYS-1))-bw/2,x1=xd(clamp(dayIdx(w.end),0,NDAYS-1))+bw/2;
      return`<line class="${cls}" x1="${x0.toFixed(1)}" x2="${x1.toFixed(1)}" y1="${yv(v).toFixed(1)}" y2="${yv(v).toFixed(1)}"/>`};
    g+=seg((f.baseline||{}).window,(f.baseline||{})[c],"lb")+seg((f.after||{}).window,(f.after||{})[c],"la");
    const cx=xd(clamp(dayIdx(f.change_day),0,NDAYS-1))-bw/2;
    g+=`<line class="cd" x1="${cx.toFixed(1)}" x2="${cx.toFixed(1)}" y1="${pt-2}" y2="${H-pb}"/><text x="${Math.min(cx+3,W-70).toFixed(1)}" y="${pt+4}">change ${esc(f.change_day.slice(5))}</text>`;
  }
  for(let d=0;d<NDAYS;d++)if(vals[d]!=null)g+=`<circle class="dot" cx="${xd(d).toFixed(1)}" cy="${yv(vals[d]).toFixed(1)}" r="1.9"/>`;
  g+=`<text x="${pl}" y="${H-3}">D00</text><text x="${W-pr}" y="${H-3}" text-anchor="end">D${String(NDAYS-1).padStart(2,"0")}</text>`;
  return g;
}
function renderShifts(){

  const hat='<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><pattern id="hatch" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="4" stroke="#ff5d6c" stroke-opacity=".5" stroke-width="1"/></pattern></defs></svg>';
  const head=`<div class="hdr">${mi?`Scanned <em>${mi.scanned}</em> metrics for one change day each · false-discovery control (Benjamini-Hochberg) across all of them · alpha <em>${mi.alpha}</em> · shifts reported <em>${S.length}</em> · ${esc(mi.engine)}`
    :`No insight scan was run on this workspace (${esc(D.meta.contract_version||"")}), so these are plain daily series. No shift is claimed and none is ruled out.`} · window <em>${NDAYS}</em> days</div>`;
  let body="";
  if(METRICS){
    const names=Object.keys(METRICS),withF=names.filter(m=>byM[m]).sort((a,b)=>byM[a].q_value-byM[b].q_value),without=names.filter(m=>!byM[m]);
    const panel=(m)=>{
      const f=byM[m],vals=[...Array(NDAYS)].map((_,d)=>mval(m,d)),kn=vals.filter(v=>v!=null).length,e=f&&f.effect||{};
      const eff=f?`×${fmtN(e.ratio)} · q ${fmtN(f.q_value)}`:"";
      const sum=f?`${mname(m)}: ${e.direction||"changed"} by ratio ${e.ratio}, q ${f.q_value}, near ${f.change_day}. ${kn} known days, ${NDAYS-kn} unknown.`:`${mname(m)}: no shift reported. ${kn} known days, ${NDAYS-kn} unknown.`;
      return`<button type="button" class="sm${f?"":" dim"}" data-m="${esc(m)}" ${f?`data-f="${esc(f.id)}"`:""} aria-pressed="${ins.metric===m||(f&&ins.fid===f.id)}">
      <div class="nm"><span>${esc(mname(m))}</span><span class="eff">${esc(eff)}</span></div>
      <svg viewBox="0 0 300 116" role="img" aria-label="${esc(sum)}">${shiftSvg(m,f)}</svg>
      <div class="mut">${f?`${e.direction==="up"?"up":"down"} ${e.difference!=null?fmtN(e.difference)+" "+esc(e.unit||""):""} · descriptive change; cause not identified`:kn?`no shift reported · ${kn} known days`:"all days unknown, not zero"}${kn&&kn<NDAYS?` · ${NDAYS-kn} unknown (hatched)`:""}</div></button>`};
    body=`<h3>Shifts reported · ${withF.length}</h3>${withF.length?`<div class="smgrid">${withF.map(panel).join("")}</div>`:`<p class="note">No metric changed enough to pass the correction at this level. That is a result: the scan ran and found nothing${mi?"":", but only if an insight scan was run, and none was here"}.</p>`}
      <h3>${mi?"Scanned, no shift reported":"Daily series"} · ${without.length}</h3>${sh.showAll?`<div class="smgrid">${without.map(panel).join("")}</div>`:`<p class="note">${without.length} metrics hidden. Hidden does not mean unscanned.</p>`}`;
  }else{
    body=S.length?`<h3>Shift findings · ${S.length}</h3><p class="note">The daily-metric series are not available from this server, so only the findings are listed.</p><div class="smgrid">${S.map(f=>`<button type="button" class="sm" data-f="${esc(f.id)}" aria-pressed="${ins.fid===f.id}"><div class="nm"><span>${esc(mname(f.metric))}</span><span class="eff">×${fmtN((f.effect||{}).ratio)} · q ${fmtN(f.q_value)}</span></div><p style="margin:4px 0">${esc(f.statement)}</p></button>`).join("")}</div>`:"";
  }
  CTR.innerHTML=hat+head+body;
}

  <span><i class="cls" style="background:repeating-linear-gradient(45deg,#ff5d6c 0 1px,transparent 1px 4px);border:1px solid #ff5d6c55"></i>hatched · unknown day (never zero)</span>

function renderMirror(){

  const nH=m.groups.length,slot=W/nH,Rh=Math.max(14,Math.min(slot,H-110)/2*.9),maxN=Math.max(1,...m.groups.map(q=>q.n));
  const s=clamp(Rh/Math.sqrt(maxN+1),5,16),rr=m.hours?clamp(s*.42,3,8):0,cy=H/2+4,e=1-Math.pow(1-DTS.pull,3),cnt=new Array(nH).fill(0);
  const selQ=(()=>{const id=dtTypeIdOf(DTS.sel);return id?m.groups.findIndex(q=>q.f&&q.f.id===id):-1})();
  const selDayObj=DTS.day!=null?m.days[DTS.day]:null;
  const pts=m.days.map(day=>{const hi=day.q>=0?day.q:nH-1,j=cnt[hi]++,hx=slot*(hi+.5),ang=j*2.39996,rad=s*Math.sqrt(j+.5);
    const tx=hx+Math.cos(ang)*rad,ty=cy+Math.sin(ang)*rad,sx=12+(day.d+.5)/NDAYS*(W-24),sy=H*.5+Math.sin(day.d*1.9)*H*.3;
    return{x:lerp(sx,tx,e),y:lerp(sy,ty,e),hi,d:day.d,day}});
  DTS.pts=pts;DTS.hubs=m.groups.map((_,i)=>({x:slot*(i+.5),y:cy,R:Rh+rr}));
  const am=hi=>{const gr=m.groups[hi];let a=gr.stable?1:.45;if(selQ>=0&&hi!==selQ)a*=.45;return a};
  g.globalCompositeOperation="lighter";
  pts.forEach(p=>{const hb=DTS.hubs[p.hi],gr=m.groups[p.hi];g.strokeStyle=hexA(gr.color,(.05+.2*e)*am(p.hi));g.lineWidth=1;g.beginPath();g.moveTo(p.x,p.y);g.lineTo(hb.x,hb.y);g.stroke()});
  if(m.hours)pts.forEach(p=>{if(p.day.hours)drawRing(g,p.x,p.y,p.day.hours,rr,now,am(p.hi)*(p.day.q<0?.6:1))});
  g.globalCompositeOperation="source-over";
  m.groups.forEach((gr,i)=>{const hb=DTS.hubs[i],a=am(i),gl=g.createRadialGradient(hb.x,hb.y,0,hb.x,hb.y,Rh);gl.addColorStop(0,hexA(gr.color,.18*a));gl.addColorStop(1,hexA(gr.color,0));
    g.fillStyle=gl;g.beginPath();g.arc(hb.x,hb.y,Rh,0,7);g.fill();
    if(gr.kind!=="un"){g.strokeStyle=hexA(gr.color,.8*a);g.beginPath();g.arc(hb.x,hb.y,4,0,7);g.stroke()}});
  pts.forEach(p=>{const gr=m.groups[p.hi],a=am(p.hi);
    if(p.day.q<0){g.strokeStyle=hexA(DT_UN,.9*a);g.lineWidth=1;g.beginPath();g.arc(p.x,p.y,2.4,0,7);g.stroke()}
    else{g.fillStyle=hexA(gr.kind==="none"?"#cfe3ea":"#dfe5e8",a);g.beginPath();g.arc(p.x,p.y,2.4,0,7);g.fill()}});
  if(selDayObj){const p=pts[selDayObj.d];g.strokeStyle="#fff";g.lineWidth=1.5;g.beginPath();g.arc(p.x,p.y,Math.max(6,rr+3),0,7);g.stroke()}
  g.font=mono(10,500);g.textAlign="center";g.textBaseline="top";
  m.groups.forEach((gr,i)=>{const hb=DTS.hubs[i],a=am(i);g.fillStyle=hexA(gr.color==="#7d878c"?"#a9b4ba":gr.color,Math.max(.6,a));
    if(gr.kind==="type"){g.fillText(gr.key+" · "+dtPct(gr.f.share),hb.x,8);g.font=mono(9,400);g.fillStyle=hexA("#9aa6ad",1);
      g.fillText("N "+gr.n+(gr.stable?" · stable":" · UNSTABLE"),hb.x,21);g.font=mono(10,500)}
    else if(gr.kind==="none"){g.fillText("no distinct day types",hb.x,8);g.font=mono(9,400);g.fillStyle="#9aa6ad";g.fillText("N "+gr.n,hb.x,21);g.font=mono(10,500)}
    else{g.font=mono(9,400);g.fillStyle="#a9b4ba";const lines=dtWrap(g,"unclassified (not enough measured features), N "+gr.n,slot-8);
      lines.forEach((t,k)=>g.fillText(t,hb.x,H-6-(lines.length-k)*12));g.font=mono(10,500)}});
  g.textAlign="left";
}
function dtWrap(g,text,maxW){const w=text.split(" "),out=[];let cur="";
  w.forEach(t=>{const n=cur?cur+" "+t:t;if(cur&&g.measureText(n).width>maxW){out.push(cur);cur=t}else cur=n});if(cur)out.push(cur);return out}

/* ============ guided tour ============ */
const TOUR=[
  {lens:"corpus",form:"anatomy",replay:true,t:10,eye:"Corpus · anatomy",cap:"One fictional window. Each record lights up when it happens, and links form once both ends exist."},
  {lens:"corpus",form:"chrono",t:7,eye:"Corpus · chrono",cap:"One lane per source. Red boxes are declared gaps. No signal is never shown as zero."},
  {lens:"corpus",form:"strata",t:7,eye:"Corpus · strata",cap:"The evidence ladder. Raw observations at the bottom, inferences at the top."},
  {lens:"corpus",form:"map",t:7,eye:"Corpus · map",cap:"Only records with a position reach the city plane. Everything else waits in the unlocated ring."},
  {lens:"shifts",t:9,eye:"Shifts · what changed",cap:"One panel per daily metric. Hatched days are unknown, never zero. Lines mark the level before and after a change day. It says when, not why."},
  {lens:"mirror",t:10,eye:"Mirror · what an observer could infer",cap:"If someone held these sources, what could they conclude? Each card says could, names its sources and holders, and lists other explanations."},
  {lens:"fan",t:8,run:()=>fanResetLayer(),eye:"Fan · one association",cap:"1,500 resamples against a world with no relationship. When the two fans overlap, the honest answer is inconclusive."},
  {lens:"train",t:9,run:()=>{initNet();tr.run=true;renderTrainPanel()},eye:"Train · optional prediction",cap:"Will tonight be a late night? A small model learns while you watch, scored against simple baselines. Prediction is optional."},
  {lens:"clusters",t:11,eye:"Day types · kinds of days",cap:"The engine groups days by how they differ from the person's own weekday. A calendar strip shows whether a type becomes more frequent. Where it finds none, it says so."},
  {lens:"loom",t:8,eye:"Loom · provenance",cap:"Every finding hangs on threads that lead back to their sources."},
  {lens:"control",t:10,run:()=>{const h=NIDX["src-healthkit"]??NIDX[HUBS[0]];if(h==null)return;ctlPreview([h]);setTimeout(()=>{if(tour&&lens==="control")ctlExecute()},2600)},eye:"Control · deletion",cap:"The participant deletes a source. Everything built on it goes dark with it."},
];
let tour=null;
function tourStep(){
  tour.i++;tour.t=0;while(tour.i<TOUR.length&&unavail(TOUR[tour.i].lens)&&TOUR[tour.i].lens!=="corpus")tour.i++;
  if(tour.i>=TOUR.length){stopTour();return}
  const s=TOUR[tour.i];setLens(s.lens);if(location.hash.slice(1)!==s.lens)location.hash=s.lens;
  if(s.form&&corpus.ok){setForm(s.form);corpus.turning=true}
  if(s.lens==="corpus"&&corpus.ok){if(s.replay){corpus.uT=0;corpus.speed=3.2;setPlaying(true)}else if(!corpus.playing)corpus.uT=UEND}
  if(s.run)s.run();
  $("#capEye").textContent=`Tour ${String(tour.i+1).padStart(2,"0")}/${String(TOUR.length).padStart(2,"0")} · ${s.eye}`;$("#capLine").textContent=s.cap;
}
function tourTick(dt){tour.t+=dt;const s=TOUR[tour.i];if(!s)return;$("#capBar").style.width=Math.min(100,tour.t/s.t*100)+"%";if(tour.t>=s.t)tourStep()}
function startTour(){const i=$("#intro");if(i)dismissIntro();tour={i:-1,t:0};$("#cap").hidden=false;$("#tourBtn").setAttribute("aria-pressed","true");$("#tourBtn").textContent="Stop tour";tourStep()}
function stopTour(){tour=null;$("#cap").hidden=true;$("#tourBtn").setAttribute("aria-pressed","false");$("#tourBtn").textContent="Tour";corpus.speed=+$("#speed").value}
$("#tourBtn").onclick=()=>tour?stopTour():startTour();
addEventListener("pointerdown",e=>{if(tour&&!e.target.closest("#tourBtn"))stopTour()},true);
addEventListener("keydown",e=>{if(tour&&e.key!=="Tab")stopTour()},true);

/* ============ lens table, loop, boot ============ */
const LENSES={
  corpus:{enter(){renderLeftCorpus();renderInspector();if(corpus.ok){drawStrip();resizeGL()}},frame:frameCorpus},
  shifts:{enter(){size2d();CTR.innerHTML="";this.off=blocked("shifts");if(!this.off)enterShifts()},frame(){}},
  mirror:{enter(){size2d();CTR.innerHTML="";this.off=false;enterMirror()},frame(){}},
  fan:{enter(){size2d();this.off=blocked("fan");if(!this.off)enterFan()},frame(n,d){if(!this.off)frameFan(n,d)}},
  train:{enter(){size2d();this.off=blocked("train");if(!this.off)enterTrain()},frame(n,d){if(!this.off)frameTrain(n,d)}},
  clusters:{enter(){size2d();this.off=blocked("clusters");if(!this.off){if(dtMode())enterDayTypes();else enterClusters()}},frame(n,d){if(!this.off){if(dtMode())frameDayTypes(n,d);else frameClusters(n,d)}}},
  loom:{enter(){size2d();this.off=blocked("loom");if(!this.off)enterLoom()},frame(n,d){if(!this.off)frameLoom(n,d)}},
  control:{enter:enterControl,frame:(n,d)=>{frameCorpus(n,d);frameControl(n)},leave:leaveControl}};
function loop(now){
  const dt=Math.min(.05,(now-lastT)/1000);lastT=now;
  try{LENSES[lens].frame(now,dt)}catch(e){console.error(e)}
  if(tour)tourTick(dt);
  requestAnimationFrame(loop);
}
addEventListener("resize",()=>{size2d();if(lens==="shifts"||lens==="mirror")return;if(LENSES[lens].off)return;if(lens==="corpus"&&corpus.ok){resizeGL();drawStrip()}if(lens==="fan")fanResetLayer()});
addEventListener("hashchange",()=>setLens(location.hash.slice(1)));
addEventListener("keydown",e=>{
  if(e.target.closest&&e.target.closest("input,select,textarea"))return;
  const m={"1":"corpus","2":"shifts","3":"mirror","4":"fan","5":"train","6":"clusters","7":"loom","8":"control"};
  if(m[e.key]){location.hash=m[e.key];return}
  if(e.key===" "&&lens==="corpus"){e.preventDefault();$("#play").click()}
  if(e.key==="Escape"&&(lens==="corpus"||lens==="control"))select(-1);
});
function dismissIntro(){const i=$("#intro");if(i.classList.contains("gone"))return;i.classList.add("gone");
  if(lens==="corpus"&&corpus.ok&&!REDUCED){corpus.uT=0;setPlaying(true)}setTimeout(()=>i.remove(),1200)}
$("#intro").addEventListener("click",dismissIntro);
$("#intro").addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" ")dismissIntro()});
(async()=>{
  await loadList();
  try{D=await loadData()}catch(e){ST.textContent=e.message;$("#intro").remove();return}
  await loadMetrics();
  buildModel();size2d();
  const sel=$("#ds");sel.innerHTML=WSLIST.map(w=>`<option value="${esc(w.key)}">${esc(w.label||w.key)}${w.workspace_id?" · "+esc(w.workspace_id):""}</option>`).join("");
  $("#ds").value=DS;$("#ds").onchange=e=>{try{sessionStorage.setItem("panoptes-ds",e.target.value);location.reload()}catch(err){ST.textContent="This browser blocks session storage, so the workspace cannot be switched here."}};
  $("#chip").textContent="Synthetic · "+(D.meta.workspace_id==="ws-demo-01"?"EX-01":D.meta.workspace_id)+(ORIGIN==="api"?" · server":" · static file");
  $("#inWs").textContent="WORKSPACE "+D.meta.workspace_id.toUpperCase();$("#inWin").textContent="WINDOW "+Math.round(WD)+" D";
  $("#inSub").textContent=String(D.meta.subject||(WSLIST.find(w=>w.key===DS)||{}).label||DS).toUpperCase().slice(0,48);
  $("#scrub").max=UEND;
  initCorpus();
  if(REDUCED&&corpus.ok)corpus.uT=UEND;
  setLens(location.hash.slice(1)||"corpus");
  requestAnimationFrame(loop);
  setTimeout(dismissIntro,REDUCED?0:2600);
})();
</script>
