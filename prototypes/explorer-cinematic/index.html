<meta charset="utf-8">
<title>Panoptes Observatory</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
/* Layout: full-bleed instrument canvas; HUD floats in a gutter frame (tabs + status top, controls left, inspector right, time rail bottom).
   Single committed dark world (an observatory at night), so no light theme. */
:root{
  --bg:#040506; --ink:#dfe5e8; --dim:#7d888e; --faint:#3a4348; --rule:rgba(150,172,184,.16);
  --panel:rgba(6,9,11,.80); --acc:#9fe6ff; --amber:#ffb45e; --ok:#86ffad; --warn:#ff5d6c; --violet:#c49bff;
  --f-display:"Cormorant Garamond","Times New Roman",serif;
  --f-body:"IBM Plex Sans",system-ui,sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden}
body{font-family:var(--f-body);font-size:13px}
#app{position:fixed;inset:0}
canvas.layer{position:absolute;inset:0;width:100%;height:100%;display:block}
#c2{pointer-events:auto}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-140%);font:500 10px/1.2 var(--f-data);letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink);background:rgba(4,5,6,.72);border:1px solid var(--rule);padding:2px 6px;white-space:nowrap}
.lbl.fixed{transform:translate(0,-50%);background:none;border:none;color:var(--dim)}
.lbl.solid{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lbl.warn{color:var(--warn);border-color:rgba(255,93,108,.4)}
#tip{position:absolute;pointer-events:none;font:500 10px/1.3 var(--f-data);color:var(--bg);background:var(--ink);padding:2px 6px;
  text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
#hud{position:absolute;inset:0;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  display:grid;grid-template-rows:auto auto 1fr auto;grid-template-columns:minmax(0,280px) 1fr minmax(0,300px);gap:8px 16px}
#hud>*{pointer-events:auto}
header{grid-column:1/-1;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--rule);padding-bottom:6px;min-width:0}
.brand{font:500 11px var(--f-data);letter-spacing:.32em;color:var(--ink);white-space:nowrap}
.brand b{font-weight:500;color:var(--dim)}
nav{display:flex;gap:2px;overflow-x:auto;min-width:0;flex:1;scrollbar-width:none}
nav a{font:500 11px var(--f-data);letter-spacing:.1em;color:var(--dim);text-decoration:none;padding:5px 10px;border:1px solid transparent;white-space:nowrap}
nav a:hover{color:var(--ink)}
nav a[aria-current="page"]{color:var(--ink);border-color:var(--rule);background:rgba(255,255,255,.03)}
nav a kbd{font:inherit;color:var(--faint);margin-right:6px}
.chip{font:500 10px var(--f-data);letter-spacing:.12em;text-transform:uppercase;border:1px solid currentColor;padding:2px 6px;white-space:nowrap}
.chip.syn{color:var(--amber)}
.toggles{display:none;gap:6px}
#status{grid-column:1/-1;font:400 10.5px/1.5 var(--f-data);letter-spacing:.1em;color:var(--dim);text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
#status em{font-style:normal;color:var(--ink)}
.panel{background:var(--panel);border:1px solid var(--rule);backdrop-filter:blur(6px);overflow-y:auto;min-width:0;max-height:100%;
  padding:12px;display:flex;flex-direction:column;gap:12px;align-self:start}
#left{grid-column:1;grid-row:3}
#right{grid-column:3;grid-row:3}
.panel h2{font:500 10px var(--f-data);letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin:0;display:flex;justify-content:space-between;gap:8px}
.panel p{margin:0;line-height:1.5;color:var(--ink)}
.panel p.note{color:var(--dim);font-size:12px}
.seg{display:flex;flex-wrap:wrap;gap:4px}
button{font:500 10.5px var(--f-data);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);background:transparent;
  border:1px solid var(--rule);padding:6px 9px;cursor:pointer}
button:hover{color:var(--ink);border-color:var(--faint)}
button[aria-pressed="true"]{color:var(--bg);background:var(--ink);border-color:var(--ink)}
button:focus-visible,nav a:focus-visible,input:focus-visible,select:focus-visible{outline:1px solid var(--acc);outline-offset:2px}
.kv{display:grid;grid-template-columns:minmax(0,38%) minmax(0,1fr);gap:3px 10px;font:400 11px/1.45 var(--f-data)}
.kv dt{overflow-wrap:anywhere;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.kv dd{margin:0;color:var(--ink);overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.unk{color:var(--warn);letter-spacing:.1em}
.cls{display:inline-block;width:8px;height:8px;margin-right:6px;vertical-align:0}
.idl{color:var(--acc);cursor:pointer;text-decoration:underline dotted;background:none;border:none;padding:0;font:inherit;letter-spacing:0;text-transform:none}
.big{font:500 22px var(--f-data);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.verdict{font:500 11px var(--f-data);letter-spacing:.14em;padding:6px 8px;border:1px solid currentColor;text-transform:uppercase}
.verdict.inc{color:var(--amber)} .verdict.ok{color:var(--ok)} .verdict.no{color:var(--warn)}
.legend{display:grid;gap:4px;font:400 10.5px var(--f-data);color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
footer{grid-column:1/-1;grid-row:4;display:flex;align-items:center;gap:12px;border-top:1px solid var(--rule);padding-top:8px;min-width:0}
footer[hidden]{display:none!important}
#scrub{flex:1;min-width:80px;accent-color:var(--acc)}
.rail{position:relative;flex:1;min-width:80px;display:flex;flex-direction:column;gap:4px}
#strip{width:100%;height:30px;display:block}
#readout{font:500 11px var(--f-data);letter-spacing:.08em;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums;min-width:150px}
select{font:500 10.5px var(--f-data);background:var(--bg);color:var(--ink);border:1px solid var(--rule);padding:5px}
#intro{position:absolute;inset:0;background:var(--bg);display:grid;place-items:center;z-index:5;transition:opacity 1.1s ease;cursor:pointer}
#intro.gone{opacity:0;pointer-events:none}
.ttl{display:grid;gap:10px;justify-items:center;text-align:center;padding-inline:16px}
.ttl .rule{width:min(560px,80vw);display:flex;justify-content:space-between;font:500 9.5px var(--f-data);letter-spacing:.25em;color:var(--dim);border-top:1px solid var(--faint);padding-top:6px}
.ttl h1{font:500 clamp(42px,9vw,104px)/1 var(--f-display);letter-spacing:.32em;margin:0 0 0 .32em;color:var(--ink);text-shadow:0 0 30px rgba(159,230,255,.25)}
.ttl .rule.b{border-top:none;border-bottom:1px solid var(--faint);padding:0 0 6px}
.ttl small{font:400 10px var(--f-data);letter-spacing:.2em;color:var(--faint);text-transform:uppercase}
#err{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:500 12px var(--f-data);color:var(--warn);text-align:center;max-width:420px;line-height:1.6}
#cap{position:absolute;left:50%;bottom:max(84px,calc(env(safe-area-inset-bottom,0px) + 84px));transform:translateX(-50%);z-index:4;pointer-events:none;
  display:grid;gap:6px;justify-items:center;text-align:center;width:min(760px,calc(100% - 32px))}
#cap .eye{font:500 10px var(--f-data);letter-spacing:.28em;color:var(--acc);text-transform:uppercase}
#cap .line{font:500 clamp(18px,2.6vw,28px)/1.25 var(--f-display);letter-spacing:.04em;color:var(--ink);text-shadow:0 0 18px rgba(4,5,6,.9)}
#cap .bar{width:100%;height:1px;background:var(--faint);position:relative}
#cap .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--acc)}
#tourBtn[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--bg)}
input[type=range]{accent-color:var(--acc)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;font:400 11px var(--f-data);color:var(--dim)}
.src{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px;align-items:center;font:400 11px var(--f-data)}
.src span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars{display:grid;gap:3px}
.bars div{display:grid;grid-template-columns:28px 1fr 44px;gap:6px;align-items:center;font:400 10.5px var(--f-data);color:var(--dim)}
.bars b{display:block;height:6px;background:var(--acc)}
pre.man{font:400 10.5px/1.5 var(--f-data);color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere;margin:0;max-height:220px;overflow:auto;border:1px solid var(--rule);padding:8px}
@media (max-width:820px){
  #cap{bottom:110px}
  header{flex-wrap:wrap;row-gap:6px}
  nav{order:3;flex-basis:100%}
  footer{flex-wrap:wrap;row-gap:6px}
  .rail{order:-1;flex-basis:100%}
  #hud{grid-template-columns:1fr;grid-template-rows:auto auto 1fr auto}
  .brand b,.chip.syn{display:none}
  .toggles{display:flex}
  #left,#right{grid-column:1;grid-row:3;max-height:62vh;display:none}
  #left.open,#right.open{display:flex}
  #readout{min-width:0}
}
@media (prefers-reduced-motion:reduce){#intro{transition:none}}
</style>

<div id="app">
  <canvas class="layer" id="gl"></canvas>
  <canvas class="layer" id="c2" hidden></canvas>
  <div id="labels"></div>
  <div id="tip" hidden></div>
  <div id="cap" hidden><div class="eye" id="capEye"></div><div class="line" id="capLine"></div><div class="bar"><i id="capBar"></i></div></div>
  <div id="hud">
    <header>
      <div class="brand">PANOPTES <b>/ LAPLACE</b></div>
      <nav id="tabs" aria-label="Lenses">
        <a href="#corpus" data-lens="corpus"><kbd>1</kbd>Corpus</a>
        <a href="#fan" data-lens="fan"><kbd>2</kbd>Fan</a>
        <a href="#train" data-lens="train"><kbd>3</kbd>Train</a>
        <a href="#clusters" data-lens="clusters"><kbd>4</kbd>Clusters</a>
        <a href="#loom" data-lens="loom"><kbd>5</kbd>Loom</a>
        <a href="#control" data-lens="control"><kbd>6</kbd>Control</a>
      </nav>
      <button id="tourBtn" type="button" aria-pressed="false">Tour</button>
      <div class="toggles"><button id="tgL" type="button">Controls</button><button id="tgR" type="button">Inspect</button></div>
      <select id="ds" aria-label="Workspace"><option value="persona">EX-01 persona</option><option value="fixtures">Fixture export</option></select>
      <span class="chip syn" id="chip">Synthetic</span>
    </header>
    <div id="status">Loading synthetic workspace…</div>
    <aside class="panel" id="left" aria-label="Lens controls"></aside>
    <aside class="panel" id="right" aria-label="Inspector"></aside>
    <footer id="foot">
      <button id="play" type="button" aria-pressed="false">Play</button>
      <div class="rail">
        <canvas id="strip"></canvas>
        <input id="scrub" type="range" min="0" max="29.4" step="0.01" value="0" aria-label="Time in observation window (days)">
      </div>
      <select id="speed" aria-label="Playback speed"><option value="0.6">0.6 d/s</option><option value="1.4" selected>1.4 d/s</option><option value="4">4 d/s</option></select>
      <div id="readout">D00</div>
    </footer>
  </div>
  <div id="intro" role="button" tabindex="0" aria-label="Skip intro">
    <div class="ttl">
      <div class="rule"><span id="inWs">WORKSPACE</span><span id="inWin">WINDOW</span></div>
      <h1>PANOPTES</h1>
      <div class="rule b"><span id="inSub">SUBJECT</span><span>SYNTHETIC</span></div>
      <small>Every name, place and number is invented · click to enter</small>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
/* ============ utilities ============ */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let rnd=mulberry(20260302);
function gauss(r=rnd){let u=0,v=0;while(!u)u=r();while(!v)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hex=h=>[parseInt(h.slice(1,3),16)/255,parseInt(h.slice(3,5),16)/255,parseInt(h.slice(5,7),16)/255];
const REDUCED=matchMedia("(prefers-reduced-motion: reduce)").matches;
const MS_DAY=864e5, BASE_UTC=Date.UTC(2026,2,2);
const DOW=["MON","TUE","WED","THU","FRI","SAT","SUN"];
function dayIdx(s){return Math.round((Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10))-BASE_UTC)/MS_DAY)}

const CLASS_COL={observation:"#b9c6cf",normalized_event:"#6fd0ff",hypothesis:"#c49bff",inference:"#ffc860",prediction:"#ff7a5a"};
const HUB_COL={"src-location":"#6fd0ff","src-motion":"#86ffad","src-healthkit":"#ff7a9a","src-eventkit":"#ffd36e","src-apr":"#b48cff","src-account-export":"#ff9f5a","src-workspace":"#ffffff"};
const EDGE_COL={VISITED:"#6fd0ff",AT_PLACE:"#6fd0ff",CORROBORATED_BY:"#86ffad",ACCESSED_BY:"#b48cff",CONTACTED:"#b48cff",USES:"#b48cff",
  CONFIRMS:"#ffd36e",SUPPORTED_BY:"#ffc860",EVIDENCE:"#ffc860",CONTRADICTED_BY:"#ff5d6c",DUPLICATE_OF:"#ff9f5a",CORRECTS:"#ffffff",MOTIVATED_BY:"#c49bff"};
const DUST={Source:600,Place:350,App:220,Domain:160,ImportBatch:120,Finding:700,Correction:300,LocationSample:25,Visit:70,Trip:80,
  ActivityInterval:55,DailyHealthAggregate:90,CalendarEvent:60,ResourceAccess:50,NetworkAggregate:90,AccountActivity:45};
const ENTITY=new Set(["Source","Place","App","Domain","ImportBatch"]);

/* ============ data ============ */
let D,R,byId={},T0,T1,NODES=[],NIDX={},EDGES=[],ADJ=[],HUBS=[],FINDINGS=[];
let DS="persona";try{DS=sessionStorage.getItem("panoptes-ds")||"persona"}catch(e){}
if(DS!=="fixtures")DS="persona";
async function loadData(){
  for(const p of DS==="fixtures"?["data/fixtures-workspace.json"]:["data/persona.json","../explorer-concept/data/persona.json"]){
    try{const r=await fetch(p);if(r.ok)return await r.json()}catch(e){}
  }
  throw new Error("Could not load persona.json. Serve this folder over HTTP (python -m http.server) from prototypes/.");
}
let WD=28,UEND=29.4,TZOFF=0;
const MON=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"],DOW_S=["SUN","MON","TUE","WED","THU","FRI","SAT"];
function tday(s){if(!s||s==="unknown")return null;const v=Date.parse(s);return isNaN(v)?null:(v-T0)/MS_DAY}
function startOf(r){return r.event_time||r.event_start||null}
function placeLbl(id){return (byId[id]&&byId[id].label||id||"?").replace(" (fictional)","")}
function title(r){
  switch(r.type){
    case"Source":return r.name+" source";
    case"Place":return placeLbl(r.id);
    case"App":return r.display_name;
    case"Domain":return r.host;
    case"ImportBatch":return"Import "+r.id.replace("ib-","");
    case"LocationSample":return"Location sample ±"+r.accuracy_m+" m";
    case"Visit":return"Visit · "+placeLbl(r.place_id);
    case"Trip":return"Trip · "+placeLbl(r.from_place_id)+" → "+placeLbl(r.to_place_id);
    case"ActivityInterval":return"Motion · "+r.activity_type;
    case"DailyHealthAggregate":return"Health day · "+(typeof r.steps==="number"?r.steps+" steps":"steps unknown");
    case"CalendarEvent":return"Calendar · "+r.title;
    case"ResourceAccess":return"Access · "+r.category+" · "+((byId[r.app_id]||{}).display_name||r.app_id);
    case"NetworkAggregate":return"Network · "+r.hits+" hits (snapshot)";
    case"AccountActivity":return r.title;
    case"Finding":return"Finding · "+r.finding_kind.replace(/_/g," ");
    case"Correction":return"Participant correction";
  }
  return r.id;
}
function buildModel(){
  R=D.records;R.forEach(r=>byId[r.id]=r);
  T0=Date.parse(D.meta.window.start);T1=Date.parse(D.meta.window.end);WD=(T1-T0)/MS_DAY;UEND=WD+1.4;
  const mz=/([+-])(\d\d):(\d\d)$/.exec(D.meta.window.start);TZOFF=mz?(mz[1]==="-"?-1:1)*(+mz[2]*60+ +mz[3])*60000:0;
  NODES=R.filter(r=>r.type!=="Link");NODES.forEach((r,i)=>NIDX[r.id]=i);
  HUBS=[...new Set(NODES.map(r=>r.source_id))].sort((a,b)=>(a==="src-workspace")-(b==="src-workspace"));
  FINDINGS=NODES.filter(r=>r.type==="Finding");
  NODES.forEach(r=>{
    r._t=tday(startOf(r))??tday(r.event_end);r._te=tday(r.event_end)??r._t;
    if(ENTITY.has(r.type))r._birth=-1;
    else if(r.type==="Finding")r._birth=WD+.3+FINDINGS.indexOf(r)*0.15;
    else if(r.type==="Correction")r._birth=WD+1;
    else r._birth=r._t==null?-1:r._t;
    r._hub=HUBS.indexOf(r.source_id);
  });
  const seen=new Set();
  function add(a,b,type){
    if(!(a in NIDX)||!(b in NIDX)||a===b)return;
    const k=a<b?a+"|"+b:b+"|"+a;if(seen.has(k))return;seen.add(k);
    const i=NIDX[a],j=NIDX[b];
    EDGES.push({i,j,type,birth:Math.max(NODES[i]._birth,NODES[j]._birth),ph:rnd()});
  }
  R.filter(r=>r.type==="Link").forEach(l=>add(l.from,l.to,l.link_type));
  NODES.forEach(r=>{
    if(r.place_id)add(r.id,r.place_id,"AT_PLACE");
    if(r.from_place_id)add(r.id,r.from_place_id,"AT_PLACE");
    if(r.to_place_id)add(r.id,r.to_place_id,"AT_PLACE");
    if(r.app_id)add(r.id,r.app_id,"USES");
    if(r.domain_id)add(r.id,r.domain_id,"CONTACTED");
    if(r.endpoint_domain_id)add(r.id,r.endpoint_domain_id,"CONTACTED");
    (r.supporting_evidence_ids||[]).forEach(e=>add(r.id,e,"EVIDENCE"));
    (r.contradicting_evidence_ids||[]).forEach(e=>add(r.id,e,"CONTRADICTED_BY"));
    (r.motivated_by_ids||[]).forEach(e=>add(r.id,e,"MOTIVATED_BY"));
    if(r.target_id)add(r.id,r.target_id,"CORRECTS");
  });
  ADJ=NODES.map(()=>[]);
  EDGES.forEach((e,k)=>{ADJ[e.i].push(k);ADJ[e.j].push(k)});
}

/* ============ HUD plumbing ============ */
const L=$("#left"),RP=$("#right"),ST=$("#status");
let lens=null;
function setLens(name){
  if(!LENSES[name])name="corpus";
  if(lens===name)return;
  if(lens&&LENSES[lens].leave)LENSES[lens].leave();
  lens=name;
  document.querySelectorAll("#tabs a").forEach(a=>{if(a.dataset.lens===name)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  const g3=name==="corpus"||name==="control";
  $("#gl").hidden=!g3;$("#c2").hidden=g3;
  $("#foot").hidden=!g3;$("#labels").innerHTML="";labelPool.length=0;$("#tip").hidden=true;
  RP.hidden=!g3;
  LENSES[name].enter();
}
function area(){
  const W=innerWidth,H=innerHeight,narrow=W<=820;
  const top=$("#status").getBoundingClientRect().bottom+10;
  let x0=16,x1=W-16;
  if(!narrow){x0=L.getBoundingClientRect().right+16;if(!RP.hidden)x1=RP.getBoundingClientRect().left-16}
  const y1=$("#foot").hidden?H-16:$("#foot").getBoundingClientRect().top-8;
  return{x:x0,y:top,w:Math.max(80,x1-x0),h:Math.max(80,y1-top)};
}
$("#tgL").onclick=()=>{L.classList.toggle("open");RP.classList.remove("open")};
$("#tgR").onclick=()=>{RP.classList.toggle("open");L.classList.remove("open")};

/* labels pool */
const labelPool=[];
function labelAt(k,text,x,y,cls){
  let el=labelPool[k];
  if(!el){el=document.createElement("div");$("#labels").appendChild(el);labelPool[k]=el}
  if(el._t!==text){el.textContent=text;el._t=text}
  const c="lbl "+(cls||"");if(el.className!==c)el.className=c;
  el.style.left=x+"px";el.style.top=y+"px";el.hidden=false;
}
function hideLabelsFrom(k){for(let i=k;i<labelPool.length;i++)labelPool[i].hidden=true}

/* 2D canvas */
const C2=$("#c2"),X=C2.getContext("2d");let DPR=1;
function size2d(){DPR=Math.min(devicePixelRatio||1,2);C2.width=innerWidth*DPR;C2.height=innerHeight*DPR;X.setTransform(DPR,0,0,DPR,0,0)}
const FD="'IBM Plex Mono',ui-monospace,Consolas,monospace";
function mono(px,w){return (w||500)+" "+px+"px "+FD}
function box(x,y,text,col,fill){

function makeMat(){
  return new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
    uniforms:{uT:{value:0},uTime:{value:0},uScale:{value:150},uGhost:{value:.1},uDensity:{value:1}},
    vertexShader:`attribute vec3 aColor;attribute float aSize;attribute float aBirth;attribute float aPhase;attribute float aSel;attribute float aKeep;uniform float uDensity;
      uniform float uT;uniform float uTime;uniform float uScale;uniform float uGhost;varying vec3 vColor;varying float vA;
      void main(){vec3 p=position+vec3(sin(uTime*.6+aPhase*6.28),cos(uTime*.5+aPhase*9.1),sin(uTime*.4+aPhase*4.7))*.35;
        vec4 mv=modelViewMatrix*vec4(p,1.0);float age=uT-aBirth;float ent=step(aBirth,-0.5);
        float on=max(ent,step(0.0,age));float flash=(1.0-ent)*on*exp(-age*4.0)*2.5;
        vA=mix(uGhost,1.0,on)+flash+aSel*1.6;vColor=aColor;
        gl_PointSize=aKeep>uDensity?0.0:aSize*(1.0+flash*.6+aSel*.8)*uScale/max(1.0,-mv.z);gl_Position=projectionMatrix*mv;}`,
    fragmentShader:`varying vec3 vColor;varying float vA;void main(){vec2 c=gl_PointCoord-.5;float d=length(c);if(d>.5)discard;
      float a=smoothstep(.5,0.,d);a*=a;gl_FragColor=vec4(vColor*a*vA,1.0);}`});
}

function nodeTargets(form){

  const lobes=HUBS.length-1;

    let ib=0,fi=0;
    NODES.forEach((r,i)=>{
      if(r.type==="ImportBatch"){set(i,[g()*2,-34-ib*7.5,-6+ib*2.2],null,3);ib++;return}
      if(r.type==="Finding"){const a=fi*1.7;set(i,[Math.cos(a)*7,10+fi*2.5,Math.sin(a)*7],null,4.5);fi++;return}
      if(r.type==="Correction"){set(i,[0,22,4],null,3);return}

      const c=[Math.sin(a)*82,12+Math.cos(a*.5)*22,Math.cos(a)*50-6],tan=[Math.cos(a),0,-Math.sin(a)];
      if(r.type==="Source"){set(i,[c[0],c[1]+16,c[2]],null,7);return}
      if(ENTITY.has(r.type)){set(i,[c[0]+g()*6,c[1]-6+g()*3,c[2]+g()*6],null,3.5);return}
      const f=r._t==null?r2():clamp(r._t/WD,0,1),w=Math.sin(f*12+k)*4;
      set(i,[c[0]+tan[0]*(f-.5)*40+g()*7,c[1]+w+g()*6,c[2]+tan[2]*(f-.5)*40+g()*7],null,r.granularity==="aggregate"?3:2.2);
    });
  }else if(form==="sphere"){
    const ord=NODES.map((r,i)=>i).sort((a,b)=>((NODES[a]._t??-99)-(NODES[b]._t??-99))||a-b);
    ord.forEach((i,k)=>{const y=1-2*(k+.5)/n,rr=Math.sqrt(1-y*y),t=k*2.39996;

    NODES.forEach((r,i)=>{const y=LV[r.evidence_class]??0,z=(r._hub-(HUBS.length-1)/2)*15+g()*2.5;
      if(r._t==null){set(i,[-112+g()*2,y,z],null,1.6);return}
      set(i,[XT(clamp(r._t/WD,0,1.05)),y,z],[XT(clamp(r._te/WD,0,1.05)),y,z],1.3)});
  }else if(form==="chrono"){
    let fi=0;

      if(r.type==="Finding"){set(i,[100+fi*3,y,0],null,1.5);fi++;return}
      if(r.type==="Correction"){set(i,[112,y,0],null,1.2);return}
      if(r._t==null){set(i,[-108+g()*2.5,y+g()*2,z],null,1.2);return}
      set(i,[XT(r._t/WD),y+g()*1.4,z],[XT(r._te/WD),y+g()*1.4,z],.7)});
  }else{
    const bb=D.meta.bounding_box,P=(lat,lon)=>[(lon-bb.lon_min)/(bb.lon_max-bb.lon_min)*170-85,0,-((lat-bb.lat_min)/(bb.lat_max-bb.lat_min)*170-85)];

      if(r.type==="LocationSample"){const p=P(r.lat,r.lon);p[1]=.6;set(i,p,null,.9);return}
      if(r.type==="Visit"&&byId[r.place_id]){const pl=byId[r.place_id],p=P(pl.lat,pl.lon);stack[r.place_id]=(stack[r.place_id]||0)+1;p[1]=2+stack[r.place_id]*1.1;set(i,p,null,1);return}
      if(r.type==="Trip"&&byId[r.from_place_id]&&byId[r.to_place_id]){const a=byId[r.from_place_id],b=byId[r.to_place_id];set(i,P(a.lat,a.lon),P(b.lat,b.lon),.5,8+g());return}

  A_sel.fill(0);if(ctl.plan)ctl.plan.forEach((d,i)=>{for(let q=0;q<nodeCount[i];q++)A_sel[nodeStart[i]+q]=d===0?1:.55});
  geo.attributes.aSel.needsUpdate=true;renderControlRight();
  if(innerWidth<=820&&ctl.plan){RP.classList.add("open");L.classList.remove("open")}
}
function ctlExecute(){
  if(!ctl.plan)return;const now=performance.now()/1000;let k=0;
  const ord=[...ctl.plan.entries()].sort((a,b)=>a[1]-b[1]);
  ord.forEach(([i,d])=>ctl.dead.set(i,now+.3+d*(REDUCED?0:.8)+(REDUCED?0:(k++%30)*.02)));
  const byDepth={};ord.forEach(([i,d])=>byDepth[d]=(byDepth[d]||0)+1);
  ctl.last={n:ord.length,root:ctl.root.map(i=>title(NODES[i])).join(", "),findings:ord.filter(([i])=>NODES[i].type==="Finding").map(([i])=>NODES[i].id),
    links:EDGES.filter(e=>ctl.plan.has(e.i)||ctl.plan.has(e.j)).length};
  ctl.plan=null;A_sel.fill(0);geo.attributes.aSel.needsUpdate=true;ctl.busy=true;ctl.manifest=null;renderControlRight();renderControlLeft();
}
function ctlRestore(){ctl.dead.clear();ctl.paused={};ctl.plan=null;ctl.last=null;ctl.manifest=null;A_sel.fill(0);if(geo){geo.attributes.aSel.needsUpdate=true;applyColors()}}
const LVL=["Selected","Records and batches it holds","Findings built on them","Corrections and hypotheses that depend on those"];
function renderControlRight(){
  if(lens!=="control")return;
  if(ctl.plan){const by={};ctl.plan.forEach((d,i)=>{by[d]=by[d]||{};const t=NODES[i].type;by[d][t]=(by[d][t]||0)+1});
    const fs=[...ctl.plan.keys()].filter(i=>NODES[i].type==="Finding").map(i=>NODES[i]);
    RP.innerHTML=`<h2>Deletion preview <span>simulation</span></h2>
    <p class="big" style="font-size:15px">${esc(ctl.root.map(i=>title(NODES[i])).join(", "))}</p>
    <dl class="kv">${Object.keys(by).sort().map(d=>`<dt>${esc(LVL[Math.min(+d,3)])}</dt><dd>${Object.entries(by[d]).map(([t,n])=>n+" "+esc(t)).join(" · ")}</dd>`).join("")}
    <dt>links that go dark</dt><dd>${EDGES.filter(e=>ctl.plan.has(e.i)||ctl.plan.has(e.j)).length}</dd></dl>
    ${fs.length?`<h2>Findings that lose evidence</h2><p class="note">${fs.map(f=>esc(f.id)+": "+esc(f.statement.slice(0,90))+"…").join("<br>")}</p><p class="note">They are removed with the source. The workbench can recompute them later from the evidence that remains, and the new version is shown as a new finding.</p>`:""}
    <div class="seg"><button type="button" id="ctlGo">Run cascade</button><button type="button" id="ctlNo">Cancel</button></div>
    <p class="note">Out of reach of this cascade: copies already exported, device or cloud backups, and a researcher's copy. Each needs its own deletion and proof. [Rules still to decide]</p>`;
    $("#ctlGo").onclick=ctlExecute;$("#ctlNo").onclick=()=>ctlPreview([]);return}
  RP.innerHTML=ctl.last?`<h2>Cascade done <span>simulation</span></h2>
    <p>${esc(ctl.last.root)}: ${ctl.last.n} records went dark and ${ctl.last.links} links were cut.</p>
    ${ctl.last.findings.length?`<p class="note">Findings removed: ${ctl.last.findings.map(esc).join(", ")}.</p>`:""}
    <p class="note">Nothing was deleted from the file. This page only simulates the participant's controls. Use Restore everything to start again.</p>`
  :`<h2>Control room <span>simulation</span></h2><p>Choose a source on the left, or click any bright record, to preview what deleting it would remove.</p>
    <p class="note">Deletion follows provenance. A source takes its records and import batches. Findings that used them as evidence go too, then corrections and hypotheses that depend on those findings.</p>`;
}
function renderControlLeft(){
  if(lens!=="control")return;const srcs=NODES.filter(r=>r.type==="Source");
  L.innerHTML=`<h2>Participant control <span>simulation</span></h2>
  <p class="note">No collection runs on this page and no copy is stored, so nothing real is paused or deleted.</p>
  <h2>Sources <span>pause from D${String(Math.floor(Math.min(corpus.uT,WD-.01))).padStart(2,"0")}</span></h2>
  ${srcs.map(s=>{const i=NIDX[s.id],dead=ctl.dead.has(i);return`<div class="src"><span style="${dead?"text-decoration:line-through;color:var(--dim)":""}"><i class="cls" style="background:${HUB_COL[s.id]||"#888"}"></i>${esc(s.name)}</span>
    <button type="button" data-pause="${esc(s.id)}" aria-pressed="${s.id in ctl.paused}" ${dead?"disabled":""}>${s.id in ctl.paused?"Paused":"Pause"}</button>
    <button type="button" data-del="${i}" ${dead?"disabled":""}>Delete</button></div>`}).join("")}
  <p class="note">Pause shows what would never have been collected after the cursor. Move the time rail first to choose the point.</p>
  <h2>Export</h2><div class="seg"><button type="button" id="ctlExp">Build export manifest</button></div><div id="manOut"></div>
  <div class="seg"><button type="button" id="ctlReset">Restore everything</button></div>`;
  L.querySelectorAll("[data-pause]").forEach(b=>b.onclick=()=>{const id=b.dataset.pause;if(id in ctl.paused)delete ctl.paused[id];else ctl.paused[id]=Math.min(corpus.uT,WD);applyColors();renderControlLeft()});
  L.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>ctlPreview([+b.dataset.del]));
  $("#ctlExp").onclick=buildManifest;$("#ctlReset").onclick=()=>{ctlRestore();renderControlLeft();renderControlRight()};
  if(ctl.manifest)showManifest();
}
async function buildManifest(){
  const keep=NODES.filter((r,i)=>!ctl.dead.has(i)&&!(ctl.paused[r.source_id]!=null&&r._birth>ctl.paused[r.source_id]));
  const recs=keep.map(r=>{const o={};Object.keys(r).filter(k=>k[0]!=="_").sort().forEach(k=>o[k]=r[k]);return o}).sort((a,b)=>a.id<b.id?-1:1);
  const body=JSON.stringify(recs);let digest="unavailable in this browser";
  try{const h=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(body));digest=[...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,"0")).join("")}catch(e){}
  const tc={};recs.forEach(r=>tc[r.type]=(tc[r.type]||0)+1);
  ctl.manifest={workspace_id:D.meta.workspace_id,contract_version:D.meta.contract_version,synthetic:true,record_count:recs.length,
    excluded_deleted:[...ctl.dead.keys()].length,paused_sources:Object.keys(ctl.paused),type_counts:tc,content_sha256:digest,
    note:"Preview only. Real V1 exports are participant-initiated encrypted batches; the package format is still provisional."};
  showManifest();
}
function showManifest(){
  const txt=JSON.stringify(ctl.manifest,null,2),o=$("#manOut");if(!o)return;
  o.innerHTML=`<pre class="man" id="manPre">${esc(txt)}</pre><div class="seg"><button type="button" id="manCopy">Copy manifest</button></div>`;
  $("#manCopy").onclick=()=>{navigator.clipboard.writeText(txt).then(()=>$("#manCopy").textContent="Copied").catch(()=>{const r=document.createRange();r.selectNodeContents($("#manPre"));const s=getSelection();s.removeAllRanges();s.addRange(r)})};
}
function enterControl(){
  if(!corpus.ok){L.innerHTML='<p class="note">The control room needs the 3D library, which did not load.</p>';return}
  corpus.uT=UEND;setPlaying(false);renderControlLeft();renderControlRight();drawStrip();resizeGL();
}
function leaveControl(){ctlRestore();corpus.sel=-1}
function frameControl(){
  const dead=ctl.dead.size,paused=Object.keys(ctl.paused).length;
  ST.innerHTML=`Control · simulation · records <em>${NODES.length-dead}/${NODES.length}</em> · deleted <em>${dead}</em> · paused sources <em>${paused}</em>${ctl.plan?" · preview <em>"+ctl.plan.size+"</em> records":""} · nothing real is changed · synthetic`;
}

/* ============ guided tour ============ */
const TOUR=[
  {lens:"corpus",form:"anatomy",replay:true,t:10,eye:"Corpus · anatomy",cap:"One fictional month. Each record lights up when it happens, and links form once both ends exist."},
  {lens:"corpus",form:"chrono",t:7,eye:"Corpus · chrono",cap:"One lane per source. Red boxes are declared gaps. No signal is never shown as zero."},
  {lens:"corpus",form:"strata",t:7,eye:"Corpus · strata",cap:"The evidence ladder. Raw observations at the bottom, inferences at the top."},
  {lens:"corpus",form:"map",t:7,eye:"Corpus · map",cap:"Only records with a position reach the city plane. Everything else waits in the unlocated ring."},
  {lens:"fan",t:8,run:()=>fanResetLayer(),eye:"Fan · finding-0002",cap:"1,500 resamples against a world with no relationship. They overlap, so the honest answer is inconclusive."},
  {lens:"train",t:9,run:()=>{initNet();tr.run=true;renderTrainPanel()},eye:"Train · live model",cap:"A small model learns while you watch. Amber pushes up, blue pushes down, pulses follow the gradient."},
  {lens:"clusters",t:11,eye:"Clusters · days",cap:"Days pull into groups on their own. Each group's stability is measured before anyone names it."},
  {lens:"loom",t:8,eye:"Loom · provenance",cap:"Every finding hangs on threads that lead back to their sources."},
  {lens:"control",t:10,run:()=>{const h=NIDX["src-healthkit"]??NIDX[HUBS[0]];if(h==null)return;ctlPreview([h]);setTimeout(()=>{if(tour&&lens==="control")ctlExecute()},2600)},eye:"Control · deletion",cap:"The participant deletes a source. Everything built on it goes dark with it."},
];
let tour=null;
function tourStep(){
  tour.i++;tour.t=0;if(tour.i>=TOUR.length){stopTour();return}
  const s=TOUR[tour.i];setLens(s.lens);if(location.hash.slice(1)!==s.lens)location.hash=s.lens;
  if(s.form&&corpus.ok){setForm(s.form);corpus.turning=true}
  if(s.lens==="corpus"&&corpus.ok){if(s.replay){corpus.uT=0;corpus.speed=3.2;setPlaying(true)}else if(!corpus.playing)corpus.uT=UEND}
  if(s.run)s.run();
  $("#capEye").textContent=`Tour ${String(tour.i+1).padStart(2,"0")}/${String(TOUR.length).padStart(2,"0")} · ${s.eye}`;$("#capLine").textContent=s.cap;
}
function tourTick(dt){tour.t+=dt;const s=TOUR[tour.i];if(!s)return;$("#capBar").style.width=Math.min(100,tour.t/s.t*100)+"%";if(tour.t>=s.t)tourStep()}
function startTour(){const i=$("#intro");if(i)dismissIntro();tour={i:-1,t:0};$("#cap").hidden=false;$("#tourBtn").setAttribute("aria-pressed","true");$("#tourBtn").textContent="Stop tour";tourStep()}
function stopTour(){tour=null;$("#cap").hidden=true;$("#tourBtn").setAttribute("aria-pressed","false");$("#tourBtn").textContent="Tour";corpus.speed=+$("#speed").value}
$("#tourBtn").onclick=()=>tour?stopTour():startTour();
addEventListener("pointerdown",e=>{if(tour&&!e.target.closest("#tourBtn"))stopTour()},true);
addEventListener("keydown",e=>{if(tour&&e.key!=="Tab")stopTour()},true);

/* ============ lens table, loop, boot ============ */
const LENSES={
  corpus:{enter(){renderLeftCorpus();renderInspector();if(corpus.ok){drawStrip();resizeGL()}},frame:frameCorpus},
  fan:{enter(){size2d();this.off=blocked("fan");if(!this.off)enterFan()},frame(n,d){if(!this.off)frameFan(n,d)}},
  train:{enter(){size2d();this.off=blocked("train");if(!this.off)enterTrain()},frame(n,d){if(!this.off)frameTrain(n,d)}},
  clusters:{enter(){size2d();this.off=blocked("clusters");if(!this.off)enterClusters()},frame(n,d){if(!this.off)frameClusters(n,d)}},
  loom:{enter(){size2d();this.off=blocked("loom");if(!this.off)enterLoom()},frame(n,d){if(!this.off)frameLoom(n,d)}},
  control:{enter:enterControl,frame:(n,d)=>{frameCorpus(n,d);frameControl(n)},leave:leaveControl}};
function loop(now){
  const dt=Math.min(.05,(now-lastT)/1000);lastT=now;
  try{LENSES[lens].frame(now,dt)}catch(e){console.error(e)}
  if(tour)tourTick(dt);
  requestAnimationFrame(loop);
}
addEventListener("resize",()=>{size2d();if(LENSES[lens].off)return;if(lens==="corpus"&&corpus.ok){resizeGL();drawStrip()}if(lens==="fan")fanResetLayer()});
addEventListener("hashchange",()=>setLens(location.hash.slice(1)));
addEventListener("keydown",e=>{
  if(e.target.closest&&e.target.closest("input,select,textarea"))return;
  const m={"1":"corpus","2":"fan","3":"train","4":"clusters","5":"loom","6":"control"};
  if(m[e.key]){location.hash=m[e.key];return}
  if(e.key===" "&&lens==="corpus"){e.preventDefault();$("#play").click()}
  if(e.key==="Escape"&&(lens==="corpus"||lens==="control"))select(-1);
});
function dismissIntro(){const i=$("#intro");if(i.classList.contains("gone"))return;i.classList.add("gone");
  if(lens==="corpus"&&corpus.ok&&!REDUCED){corpus.uT=0;setPlaying(true)}setTimeout(()=>i.remove(),1200)}
$("#intro").addEventListener("click",dismissIntro);
$("#intro").addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" ")dismissIntro()});
(async()=>{
  try{D=await loadData()}catch(e){ST.textContent=e.message;$("#intro").remove();return}
  buildModel();size2d();
  $("#ds").value=DS;$("#ds").onchange=e=>{try{sessionStorage.setItem("panoptes-ds",e.target.value);location.reload()}catch(err){ST.textContent="This browser blocks session storage, so the workspace cannot be switched here."}};
  $("#chip").textContent="Synthetic · "+(D.meta.workspace_id==="ws-demo-01"?"EX-01":D.meta.workspace_id);
  $("#inWs").textContent="WORKSPACE "+D.meta.workspace_id.toUpperCase();$("#inWin").textContent="WINDOW "+Math.round(WD)+" D";
  $("#inSub").textContent=DS==="fixtures"?"FIXTURE EXPORT":"SUBJECT EX-01";
  $("#scrub").max=UEND;
  initCorpus();
  if(REDUCED&&corpus.ok)corpus.uT=UEND;
  setLens(location.hash.slice(1)||"corpus");
  requestAnimationFrame(loop);
  setTimeout(dismissIntro,REDUCED?0:2600);
})();
</script>
