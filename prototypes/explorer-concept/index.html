<title>Panoptes Ops Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta charset="utf-8">
<style>
:root{
  color-scheme:dark;
  --bg-void:#070A0F; --bg-panel:#0E141C; --bg-panel-a:rgba(14,20,28,.86); --bg-raise:#141C27;
  --line-faint:#1E2A38; --line-strong:#33475E;
  --text-primary:#D7E2EE; --text-muted:#8DA1B5;
  --accent:#3EE0C4; --accent-dim:#1B6E62;
  --cls-observation:#9FB4C8; --cls-event:#5CA8FF; --cls-hypothesis:#E6B84C; --cls-inference:#B58CFF; --cls-prediction:#FF7AB0;
  --state-unknown:#566170; --state-alert:#FF5A4D; --state-ok:#6BE39A;
  --consent-bg:#12303A; --consent-text:#3EE0C4;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
  --font-sans:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg-void);color:var(--text-primary);font:14px/1.45 var(--font-sans);overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono)}
.muted{color:var(--text-muted)}
.unk{display:inline-block;font:600 11px var(--font-mono);letter-spacing:.06em;color:var(--text-muted);padding:0 5px;border:1px solid var(--state-unknown);background:repeating-linear-gradient(135deg,rgba(86,97,112,.55) 0 1px,transparent 1px 5px)}
#app{height:100%;display:flex;flex-direction:column;gap:8px;overflow:hidden;min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* banner */
.banner{flex:none;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;justify-content:space-between;background:var(--consent-bg);color:var(--consent-text);border:1px solid var(--accent-dim);padding:6px 10px;font:500 12px var(--font-mono);letter-spacing:.06em}
.banner b{font-weight:600}
.banner .sep{opacity:.5;margin:0 4px}
.banner .warn{color:var(--cls-hypothesis)}
.banner .clock{color:var(--text-primary);font-variant-numeric:tabular-nums;white-space:nowrap}
.banner .clock em{font-style:normal;color:var(--text-muted)}

/* bars */
.bar{flex:none;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.tabs{display:flex;gap:2px;overflow-x:auto;max-width:100%;scrollbar-width:thin}
.tab,.lens,.btn{background:var(--bg-panel);border:1px solid var(--line-strong);padding:5px 9px;font:500 12px var(--font-mono);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.tab[aria-current=page],.lens[aria-pressed=true],.btn.on{border-color:var(--accent);color:var(--accent);background:#0f2a2d}
.lens span{color:var(--text-muted);margin-right:4px}
.lens[aria-pressed=true] span{color:var(--accent)}
.btn:hover,.tab:hover,.lens:hover{border-color:var(--text-muted)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.danger{border-color:var(--state-alert);color:var(--state-alert)}
.lenses{display:flex;gap:2px;flex-wrap:wrap}
.tools{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}

/* stage */
#main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr);gap:10px;overflow-y:auto;overflow-x:hidden;align-content:start;padding-bottom:6px}
#main.wctx{grid-template-columns:minmax(0,1fr)}
@media(min-width:980px){
  #main{overflow:hidden;align-content:stretch;grid-template-rows:minmax(0,1fr)}
  #main.wctx{grid-template-columns:minmax(0,1fr) 340px}
  #view,#ctx{overflow-y:auto;overflow-x:hidden;min-height:0}
}
#view{min-width:0}
#ctx{min-width:0;display:flex;flex-direction:column;gap:10px}
#ctx:empty{display:none}
#status{flex:none;font:12px var(--font-mono);color:var(--text-muted);border-top:1px solid var(--line-faint);padding:5px 0 8px;display:flex;flex-wrap:wrap;gap:2px 14px}
#status b{color:var(--text-primary);font-weight:500}

/* panels with corner brackets */
.panel{position:relative;background-color:var(--bg-panel-a);border:1px solid var(--line-faint);padding:12px;margin-bottom:10px;min-width:0;
  background-image:
   linear-gradient(var(--accent),var(--accent)),linear-gradient(var(--accent),var(--accent)),
   linear-gradient(var(--accent),var(--accent)),linear-gradient(var(--accent),var(--accent)),
   linear-gradient(var(--accent),var(--accent)),linear-gradient(var(--accent),var(--accent)),
   linear-gradient(var(--accent),var(--accent)),linear-gradient(var(--accent),var(--accent));
  background-repeat:no-repeat;
  background-size:14px 2px,2px 14px,14px 2px,2px 14px,14px 2px,2px 14px,14px 2px,2px 14px;
  background-position:left top,left top,right top,right top,left bottom,left bottom,right bottom,right bottom}
.panel.flat{background-image:none}
.panel h2,.panel h3{margin:0 0 8px;font:600 12px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted)}
.panel h2{font-size:13px;color:var(--text-primary)}
.panel p{margin:6px 0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px}
.note{font-size:12.5px;color:var(--text-muted);border-left:2px solid var(--line-strong);padding:2px 0 2px 8px;margin:8px 0}
.note.warn{border-color:var(--cls-hypothesis);color:var(--text-primary)}
.kv{display:grid;grid-template-columns:minmax(80px,32%) 1fr;gap:3px 10px;font-size:13px;margin:0}
.kv dt{color:var(--text-muted);font:12px var(--font-mono);text-transform:uppercase;letter-spacing:.04em}
.kv dd{margin:0;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{text-align:left;padding:4px 8px 4px 0;border-bottom:1px solid var(--line-faint);vertical-align:top}
th{font:600 11px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}
.tscroll{overflow-x:auto;max-width:100%}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--font-mono)}

/* class badges: shape + label, never color alone */
.cb{display:inline-flex;align-items:center;gap:6px;font:600 11px var(--font-mono);letter-spacing:.07em;text-transform:uppercase;padding:2px 7px;border:1px solid;white-space:nowrap}
.cb i{display:inline-block;width:9px;height:9px}
.c-observation{color:var(--cls-observation);border-color:var(--cls-observation)}
.c-observation i{border:2px solid currentColor;border-radius:50%}
.c-normalized_event{color:var(--cls-event);border-color:var(--cls-event);background:rgba(92,168,255,.1)}
.c-normalized_event i{background:currentColor}
.c-hypothesis{color:var(--cls-hypothesis);border:1px dashed var(--cls-hypothesis)}
.c-hypothesis i{border:1px dashed currentColor;border-radius:50%}
.c-inference{color:var(--cls-inference);border:3px double var(--cls-inference);padding:0 6px}
.c-inference i{border:3px double currentColor;border-radius:50%}
.c-prediction{color:var(--cls-prediction);border-color:var(--cls-prediction);background:repeating-linear-gradient(135deg,rgba(255,122,176,.25) 0 2px,transparent 2px 6px)}
.c-prediction i{background:repeating-linear-gradient(135deg,currentColor 0 2px,transparent 2px 4px)}
.tag{display:inline-block;font:600 11px var(--font-mono);letter-spacing:.07em;text-transform:uppercase;padding:1px 6px;border:1px solid var(--line-strong);color:var(--text-muted)}
.tag.ok{border-color:var(--state-ok);color:var(--state-ok)}
.tag.alert{border-color:var(--state-alert);color:var(--state-alert)}
.tag.warn{border-color:var(--cls-hypothesis);color:var(--cls-hypothesis)}
.chip{display:inline-flex;gap:5px;align-items:center;background:var(--bg-raise);border:1px solid var(--line-strong);padding:2px 7px;margin:2px 4px 2px 0;font:12px var(--font-mono);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip:hover,.chip.sel{border-color:var(--accent);color:var(--accent)}
.chipbox{display:flex;flex-wrap:wrap}
.sens{transition:filter .12s}
#app.blur .sens{filter:blur(6px)}

/* map */
.mapwrap{position:relative;width:100%;aspect-ratio:1/1;max-height:62vh;background:var(--bg-void);border:1px solid var(--line-strong);overflow:hidden}
@media(min-width:700px){.mapwrap{aspect-ratio:4/3;max-height:none}}
.mapwrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
.layerrow{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;margin-bottom:8px;font:12px var(--font-mono)}
.layerrow label{display:inline-flex;gap:5px;align-items:center;cursor:pointer}
.layerrow input{accent-color:var(--accent)}
.layerrow select,.sel-input{background:var(--bg-panel);color:var(--text-primary);border:1px solid var(--line-strong);font:12px var(--font-mono);padding:3px 6px}
.scrub{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.scrub input[type=range]{flex:1 1 200px;accent-color:var(--accent);min-width:120px;height:24px}
.stateline{font:13px var(--font-mono);padding:8px 10px;border:1px solid var(--line-strong);margin:8px 0;background:var(--bg-panel)}
.stateline.gap{border-color:var(--state-unknown);background:repeating-linear-gradient(135deg,rgba(86,97,112,.35) 0 1px,transparent 1px 7px),var(--bg-panel)}
.srows{position:relative;margin-top:6px}
.srow{display:flex;align-items:center;gap:6px;height:14px;margin-bottom:2px}
.srow .sl{flex:none;width:36px;font:11px var(--font-mono);color:var(--text-muted)}
.cells{flex:1;display:grid;grid-template-columns:repeat(28,1fr);gap:1px;height:100%}
.dc{display:block;border:1px solid var(--line-faint);background:transparent}
.dc.d1{background:rgba(159,180,200,.25)}.dc.d2{background:rgba(159,180,200,.5)}.dc.d3{background:rgba(159,180,200,.85)}
.dc.none{border-style:dotted;border-color:var(--line-strong)}
.dc.gap,.dc.pgap{border-color:var(--state-unknown);background:repeating-linear-gradient(135deg,var(--state-unknown) 0 1px,transparent 1px 4px)}
.dc.pgap{background:repeating-linear-gradient(135deg,var(--state-unknown) 0 1px,transparent 1px 4px),rgba(159,180,200,.4)}
.ph{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--accent);pointer-events:none}
.sdays{display:flex;margin-left:42px;font:11px var(--font-mono);color:var(--text-muted);justify-content:space-between}
.fx-surface{position:relative}
#app.fx:not(.lens6) .fx-surface::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px)}
@media(prefers-reduced-motion:no-preference){
  #app.fx:not(.lens6) .fx-surface::before{content:"";position:absolute;left:0;right:0;height:40px;top:-40px;pointer-events:none;z-index:2;background:linear-gradient(transparent,rgba(62,224,196,.07),transparent);animation:sweep 7s linear infinite}
}
@keyframes sweep{to{top:100%}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* timeline */
.tlwrap{width:100%;overflow-x:auto;background:var(--bg-void);border:1px solid var(--line-faint)}
#app.lens6 .tlwrap svg,#app.lens6 .mapwrap,#app.lens6 .invplot{filter:grayscale(1) contrast(1.15)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font:12px var(--font-mono);color:var(--text-muted);margin:8px 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend svg{display:block}

/* graph / plots */
.svgbox{width:100%;overflow:hidden}
.svgbox svg{display:block;width:100%;height:auto}
.node{cursor:pointer}
.node:focus-visible{outline:none}
.node:focus-visible .nshape{stroke:var(--accent);stroke-width:3}
.verdict{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid;padding:8px 10px;margin:8px 0;font:600 13px var(--font-mono);letter-spacing:.06em}
.verdict.inc{border-color:var(--cls-hypothesis);color:var(--cls-hypothesis);background:rgba(230,184,76,.07)}
.verdict.ins{border-color:var(--cls-observation);color:var(--cls-observation);background:rgba(159,180,200,.07)}
.verdict.desc{border-color:var(--cls-event);color:var(--cls-event);background:rgba(92,168,255,.07)}
.verdict.hyp{border-color:var(--cls-hypothesis);color:var(--cls-hypothesis);border-style:dashed}
.fcard{display:block;width:100%;text-align:left;background:var(--bg-panel);border:1px solid var(--line-strong);padding:8px 10px;margin-bottom:6px}
.fcard[aria-pressed=true]{border-color:var(--accent)}
.fcard .t{font:12px var(--font-mono);color:var(--text-muted)}
.expl{border:1px dashed var(--cls-hypothesis);padding:12px;margin-top:10px;background:rgba(230,184,76,.04)}
.expl .lbl{font:600 12px var(--font-mono);letter-spacing:.1em;color:var(--cls-hypothesis);margin-bottom:6px}
.sent{margin:6px 0}
.sent.unl{border-left:3px solid var(--state-alert);padding-left:8px}
.facts{border:1px solid var(--line-strong);padding:12px;background:var(--bg-panel)}
.facts .lbl{font:600 12px var(--font-mono);letter-spacing:.1em;color:var(--accent);margin-bottom:6px}
.sim{border:1px dashed var(--state-alert);padding:10px;margin:8px 0;background:repeating-linear-gradient(135deg,rgba(255,90,77,.07) 0 2px,transparent 2px 9px)}
.switch{display:inline-flex;align-items:center;gap:8px;font:12px var(--font-mono)}
.switch button{min-width:74px}
.trail{list-style:none;margin:0;padding:0}
.trail li{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:7px 0;border-bottom:1px solid var(--line-faint)}
.hint{padding:16px;border:1px dashed var(--line-strong);color:var(--text-muted);font-size:13px}
details>summary{cursor:pointer;font:12px var(--font-mono);color:var(--text-muted);padding:3px 0}
.errbox{max-width:640px;margin:20px auto;border:1px solid var(--state-alert);padding:16px;background:var(--bg-panel)}
.errbox code{font-family:var(--font-mono);background:var(--bg-raise);padding:1px 5px}
.pill{font-variant-numeric:tabular-nums}
.lensnote{font-size:12.5px;border:1px solid var(--cls-inference);padding:6px 10px;margin:8px 0;color:var(--text-primary)}

/* palette + help */
.modal{position:fixed;inset:0;background:rgba(3,5,8,.7);display:flex;align-items:flex-start;justify-content:center;padding:12vh 16px 16px;z-index:50}
.modal[hidden]{display:none}
.mbox{width:min(560px,100%);background:var(--bg-panel);border:1px solid var(--accent);max-height:70%;display:flex;flex-direction:column}
.mbox input{width:100%;background:var(--bg-void);color:var(--text-primary);border:0;border-bottom:1px solid var(--line-strong);padding:12px;font:15px var(--font-mono)}
.mbox ul{list-style:none;margin:0;padding:0;overflow-y:auto}
.mbox li button{display:flex;width:100%;gap:10px;text-align:left;background:none;border:0;border-bottom:1px solid var(--line-faint);padding:8px 12px;font:13px var(--font-mono)}
.mbox li button[aria-selected=true]{background:#0f2a2d;color:var(--accent)}
.mbox li .k{flex:none;width:74px;color:var(--text-muted);text-transform:uppercase;font-size:11px;padding-top:2px}
.mbox .help{padding:14px;overflow-y:auto;font-size:13px}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<div id="app">
  <header class="banner" id="banner" role="banner"></header>
  <div class="bar">
    <nav class="tabs" id="nav" aria-label="Screens"></nav>
    <div class="lenses" id="lenses" role="group" aria-label="Lens (keys 1 to 6)"></div>
    <div class="tools" id="tools"></div>
  </div>
  <main id="main" class="wctx">
    <section id="view" aria-live="polite"><div class="hint">Loading synthetic persona...</div></section>
    <aside id="ctx" aria-label="Context panel"></aside>
  </main>
  <footer id="status"></footer>
</div>
<div class="modal" id="palette" hidden role="dialog" aria-modal="true" aria-label="Command palette">
  <div class="mbox"><input id="pq" type="text" autocomplete="off" spellcheck="false" placeholder="Jump to a screen, lens, action or object..." aria-label="Command palette search"><ul id="pl" role="listbox"></ul></div>
</div>
<div class="modal" id="help" hidden role="dialog" aria-modal="true" aria-label="Shortcuts and about">
  <div class="mbox"><div class="help" id="helpbody"></div></div>
</div>

<script>
(async function(){
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p2=n=>String(n).padStart(2,'0');
const UNK='unknown';
const RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const CLSN={observation:'Observation',normalized_event:'Normalized event',hypothesis:'Hypothesis',inference:'Inference',prediction:'Prediction'};
const SCREENS=[['map','Map'],['timeline','Timeline'],['dossier','Dossier'],['graph','Graph'],['coverage','Coverage'],['investigation','Investigate'],['control','Control'],['briefing','Briefing']];
const GKEYS={m:'map',t:'timeline',d:'dossier',l:'graph',c:'coverage',i:'investigation',p:'control',b:'briefing'};
const LENSES=[['EVIDENCE','Evidence','What is this based on?'],['COVERAGE','Coverage / missingness','Where is the data thin or absent?'],['TIME-HEAT','Time-heat','When does this happen?'],['UNCERTAIN','Uncertainty','How sure are we?'],['PRIVACY','Privacy exposure','Which apps touched which resources and domains?'],['FOCUS','Noir / focus','Reduce noise to read one thing.']];
const CTX_SCREENS=['map','timeline','graph','coverage','investigation'];

const S={screen:'map',lens:1,t:1*1440+12*60,play:false,speed:1,sel:null,paused:{},fx:false,blur:false,trail:3,
  layers:{places:true,visits:true,trips:true,samples:false},tl:{start:0,span:14,table:false},ctxTab:'tele',scratch:[],
  invSel:'finding-0002',delSrc:'src-account-export',delTyped:'',delResult:'',gx:{},dosFind:null};
try{S.fx=localStorage.getItem('pnx-fx')==='1';const l=parseInt(localStorage.getItem('pnx-lens'),10);if(l>=1&&l<=6)S.lens=l}catch(e){}

// ---------- load ----------
let D,R,byId={},byType={},T0A=0,TOTAL=40320,GAPS=[],SNAP=[],EDGES=[],OUT={},INN={};
function showError(e){
  $('#main').className='';$('#ctx').innerHTML='';
  $('#view').innerHTML=`<div class="errbox"><h2 class="mono" style="margin-top:0">DATA NOT LOADED</h2>
  <p>This page could not fetch <code>data/persona.json</code> (${esc(e&&e.message||e)}). Browsers block <code>fetch</code> from <code>file://</code> pages.</p>
  <p>From the folder <code>prototypes/explorer-concept</code> run:</p><p><code>python -m http.server</code></p>
  <p>then open <code>http://localhost:8000</code>. The data file is synthetic; nothing else is loaded.</p></div>`;
  $('#banner').innerHTML='<span><b>SYNTHETIC DEMO</b><span class="sep">|</span>DATA NOT LOADED</span>';
}
try{const res=await fetch('data/persona.json');if(!res.ok)throw new Error('HTTP '+res.status);D=await res.json()}catch(e){showError(e);return}
R=D.records;
function pa(s){const m=/^(\d{4})-(\d\d)-(\d\d)T(\d\d):(\d\d)/.exec(s||'');return m?Date.UTC(+m[1],m[2]-1,+m[3],+m[4],+m[5])/60000:null}
T0A=pa(D.meta.window.start);TOTAL=pa(D.meta.window.end)-T0A;
const pt=s=>{const a=pa(s);return a==null?null:a-T0A};
const fmtT=(m,y)=>{const d=new Date((T0A+m)*60000);return (y?d.getUTCFullYear()+'-':'')+p2(d.getUTCMonth()+1)+'-'+p2(d.getUTCDate())+' '+p2(d.getUTCHours())+':'+p2(d.getUTCMinutes())};
const fmtD=m=>fmtT(m).slice(0,5);
const dayOf=m=>Math.floor(m/1440);
const dur=m=>{m=Math.round(m);const h=Math.floor(m/60),mm=m%60;return h?h+'h'+(mm?' '+p2(mm)+'m':''):mm+'m'};
R.forEach(r=>{byId[r.id]=r;(byType[r.type]=byType[r.type]||[]).push(r);
  const s=r.event_time||r.event_start;if(s){r._s=pt(s);r._e=r.event_end?pt(r.event_end):r._s}});
const T=n=>byType[n]||[];
T('Source').forEach(s=>(s.missing_periods||[]).forEach(mp=>GAPS.push({src:s.id,name:s.name,s:pt(mp.start),e:pt(mp.end),kind:mp.kind,reason:mp.reason})));
(function(){const g={};T('NetworkAggregate').forEach(n=>{(g[n.snapshot_id]=g[n.snapshot_id]||{id:n.snapshot_id,s:n._s,e:n._e,n:0}).n++});SNAP=Object.values(g).sort((a,b)=>a.s-b.s)})();
// edges
const SKIP=new Set(['id','workspace_id','source_id','import_batch_id','evidence_ids']);
const pairs=new Set();
T('Link').forEach(l=>{pairs.add(l.from+'|'+l.to);EDGES.push({a:l.from,b:l.to,rel:l.link_type,cls:l.evidence_class,n:(l.evidence_ids||[]).length,link:l.id})});
R.forEach(r=>{if(r.type==='Link')return;for(const k in r){if(SKIP.has(k))continue;const v=r[k];const arr=typeof v==='string'?[v]:Array.isArray(v)?v:null;if(!arr)continue;

// ---------- map ----------
const MAP={cv:null,cx:null,w:0,h:0,dpr:1,hits:[],pat:null};
function mapGeom(){const b=D.meta.bounding_box,pad=34;const lonS=b.lon_max-b.lon_min,latS=b.lat_max-b.lat_min;
  const sc=Math.min((MAP.w-pad*2)/lonS,(MAP.h-pad*2)/latS);const bw=lonS*sc,bh=latS*sc,ox=(MAP.w-bw)/2,oy=(MAP.h-bh)/2;
  return {sc,ox,oy,bw,bh,b,px:(lat,lon)=>[ox+(lon-b.lon_min)*sc,oy+bh-(lat-b.lat_min)*sc],mpx:m=>m*sc/111320}}
function hatchPat(x){const c=document.createElement('canvas');c.width=c.height=10;const q=c.getContext('2d');q.strokeStyle=C['state-unknown'];q.lineWidth=1.4;q.beginPath();q.moveTo(-1,11);q.lineTo(11,-1);q.stroke();return x.createPattern(c,'repeat')}
function placeXY(g,id){const p=byId[id];return p?g.px(p.lat,p.lon):[0,0]}
function brackets(x,cx,cy,s,k){x.beginPath();[[-1,-1],[1,-1],[1,1],[-1,1]].forEach(([a,b])=>{x.moveTo(cx+a*s,cy+b*s*.45);x.lineTo(cx+a*s,cy+b*s);x.lineTo(cx+a*s*.45,cy+b*s)});x.stroke()}
function anchor(g,id){const r=byId[id];if(!r)return null;
  if(r.type==='Place')return placeXY(g,id);
  if(r.type==='Visit')return placeXY(g,r.place_id);
  if(r.type==='Trip'){const a=placeXY(g,r.from_place_id),b=placeXY(g,r.to_place_id);return [(a[0]+b[0])/2,(a[1]+b[1])/2]}
  if(r.type==='LocationSample')return g.px(r.lat,r.lon);return null}
function dwellBins(pid,a,b){const bins=new Array(24).fill(0);T('Visit').filter(v=>v.place_id===pid).forEach(v=>{for(let m=Math.max(v._s,a);m<=Math.min(v._e,b);m+=15)bins[Math.floor((m%1440)/60)]+=15});return bins}
function drawMap(){
  const x=MAP.cx;if(!x||!MAP.w)return;const g=mapGeom();const L=S.lens;MAP.hits=[];const t=S.t;
  const w=viewWin();x.setTransform(MAP.dpr,0,0,MAP.dpr,0,0);x.clearRect(0,0,MAP.w,MAP.h);x.fillStyle=col('bg-void');x.fillRect(0,0,MAP.w,MAP.h);
  const glow=S.fx&&!RM&&L!==6;
  // grid
  x.font=`11px ${FONT}`;x.textBaseline='middle';
  for(let i=0;i<=12;i++){const lat=g.b.lat_min+i*.005,y=g.px(lat,0)[1];x.strokeStyle=i%4===0?col('line-strong'):col('line-faint');x.lineWidth=1;x.beginPath();x.moveTo(g.ox,y);x.lineTo(g.ox+g.bw,y);x.stroke();
    if(i%4===0){x.fillStyle=col('text-muted');x.textAlign='right';x.fillText(lat.toFixed(2)+'N',g.ox-4,y)}}
  for(let i=0;i<=12;i++){const lon=g.b.lon_min+i*.005,xx=g.px(0,lon)[0];x.strokeStyle=i%4===0?col('line-strong'):col('line-faint');x.beginPath();x.moveTo(xx,g.oy);x.lineTo(xx,g.oy+g.bh);x.stroke();
    if(i%4===0){x.fillStyle=col('text-muted');x.textAlign='center';x.fillText(Math.abs(lon).toFixed(2)+'W',xx,g.oy+g.bh+12)}}
  x.strokeStyle=col('accent');x.lineWidth=2;
  x.beginPath();[[g.ox,g.oy,1,1],[g.ox+g.bw,g.oy,-1,1],[g.ox+g.bw,g.oy+g.bh,-1,-1],[g.ox,g.oy+g.bh,1,-1]].forEach(([a,b,dx,dy])=>{x.moveTo(a+dx*16,b);x.lineTo(a,b);x.lineTo(a,b+dy*16)});x.stroke();
  // gap
  const gap=gapAt('src-location',t);
  if(gap){if(!MAP.pat)MAP.pat=hatchPat(x);x.save();x.globalAlpha=.55;x.fillStyle=MAP.pat;x.fillRect(g.ox,g.oy,g.bw,g.bh);x.restore();}
  x.globalAlpha=L===5?.3:1;
  // trips
  if(S.layers.trips){T('Trip').forEach(tr=>{if(tr._s>t||tr._e<w.a)return;const a=placeXY(g,tr.from_place_id),b=placeXY(g,tr.to_place_id);
    const live=t>=tr._s&&t<=tr._e;const age=live?0:Math.min(1,(t-tr._e)/Math.max(1,t-w.a||1));
    x.save();x.globalAlpha*=live?1:Math.max(.12,.85*(1-age));x.strokeStyle=col('cls-event');x.lineWidth=live?3:(L===6?2.5:1.6);x.setLineDash(tr.mode==='walk'?[2,5]:[9,5]);

    x.beginPath();x.moveTo(a[0],a[1]);x.lineTo(b[0],b[1]);x.stroke();x.setLineDash([]);
    const ang=Math.atan2(b[1]-a[1],b[0]-a[0]),mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2;x.fillStyle=col('cls-event');x.beginPath();x.moveTo(mx+8*Math.cos(ang),my+8*Math.sin(ang));x.lineTo(mx-5*Math.cos(ang)+5*Math.sin(ang),my-5*Math.sin(ang)-5*Math.cos(ang));x.lineTo(mx-5*Math.cos(ang)-5*Math.sin(ang),my-5*Math.sin(ang)+5*Math.cos(ang));x.fill();
    if(live){x.fillStyle=col('text-primary');x.textAlign='left';x.fillText('IN TRANSIT · route not recorded',mx+10,my-12)}
    x.restore();MAP.hits.push({id:tr.id,seg:[a[0],a[1],b[0],b[1]],pri:2})})}
  // samples
  const showS=S.layers.samples||L===2||L===4;
  if(showS){T('LocationSample').forEach(s=>{if(s._s>t||s._s<w.a)return;const p=g.px(s.lat,s.lon);const age=(t-s._s)/Math.max(1,t-w.a||1);
    x.save();x.globalAlpha*=Math.max(.2,1-age*.8);
    if(L===4){x.strokeStyle=col('cls-observation');x.lineWidth=1;x.beginPath();x.arc(p[0],p[1],Math.max(3,g.mpx(s.accuracy_m*20)),0,7);x.stroke()}
    x.fillStyle=col('cls-observation');x.beginPath();x.arc(p[0],p[1],2.6,0,7);x.fill();x.restore();MAP.hits.push({id:s.id,x:p[0],y:p[1],r:9,pri:3})})}
  // places + visits

function heatMatrix(ws,we){

// ---------- graph ----------
const SHAPE={Place:'c',App:'h',Domain:'t',Visit:'s',Trip:'d',Source:'c',Finding:'o',Correction:'s',ImportBatch:'s',CalendarEvent:'r',DailyHealthAggregate:'r',NetworkAggregate:'r',ResourceAccess:'h',AccountActivity:'c',LocationSample:'c',ActivityInterval:'d'};
function shapeSVG(sh,x,y,r,cls,sel){
  const c=cls==='hypothesis'?C['cls-hypothesis']:cls==='inference'?C['cls-inference']:cls==='normalized_event'?C['cls-event']:C['cls-observation'];
  const st=(extra)=>`class="nshape" fill="${cls==='normalized_event'?'rgba(92,168,255,.25)':C['bg-panel']}" stroke="${sel?C.accent:c}" stroke-width="${sel?3:1.6}" ${cls==='hypothesis'?'stroke-dasharray="4 3"':''} ${extra}`;
  const base=sh==='c'?`<circle cx="${x}" cy="${y}" r="${r}" ${st('')}/>`:sh==='s'?`<rect x="${x-r}" y="${y-r}" width="${2*r}" height="${2*r}" ${st('')}/>`:sh==='d'?`<polygon points="${x},${y-r-2} ${x+r+2},${y} ${x},${y+r+2} ${x-r-2},${y}" ${st('')}/>`:sh==='t'?`<polygon points="${x},${y-r-1} ${x+r+2},${y+r} ${x-r-2},${y+r}" ${st('')}/>`:sh==='r'?`<rect x="${x-r-3}" y="${y-r*.7}" width="${2*r+6}" height="${r*1.4}" ${st('')}/>`:sh==='o'?`<polygon points="${[0,1,2,3,4,5,6,7].map(i=>{const a=i*Math.PI/4+Math.PI/8;return (x+(r+2)*Math.cos(a)).toFixed(1)+','+(y+(r+2)*Math.sin(a)).toFixed(1)}).join(' ')}" ${st('')}/>`:`<polygon points="${[0,1,2,3,4,5].map(i=>{const a=i*Math.PI/3;return (x+(r+1)*Math.cos(a)).toFixed(1)+','+(y+(r+1)*Math.sin(a)).toFixed(1)}).join(' ')}" ${st('')}/>`;
  return base+(cls==='inference'?(sh==='c'?`<circle cx="${x}" cy="${y}" r="${r-4}" fill="none" stroke="${c}" stroke-width="1.2"/>`:`<rect x="${x-r+4}" y="${y-r+4}" width="${2*r-8}" height="${2*r-8}" fill="none" stroke="${c}" stroke-width="1.2"/>`):'');
}
function graphView(){
  const id=S.sel&&byId[S.sel]?S.sel:'place-work';const c=byId[id];
  const groups={};nbrs(id).forEach(n=>{const k=byId[n.id].type+'|'+n.rel+'|'+n.dir;(groups[k]=groups[k]||{type:byId[n.id].type,rel:n.rel,dir:n.dir,ids:[],e:n.e}).ids.push(n.id)});
  const gl=Object.keys(groups).sort().map(k=>groups[k]);
  const nodes=[];gl.forEach(g=>{g.ids=[...new Set(g.ids)].sort();const key=g.type+'|'+g.rel+'|'+g.dir;
    if(g.ids.length>6&&!S.gx[key])nodes.push({cluster:true,key,g,n:g.ids.length});
    else{const cap=S.gx[key]?30:6;g.ids.slice(0,cap).forEach(i=>nodes.push({id:i,g}));if(g.ids.length>cap)nodes.push({cluster:true,key,g,n:g.ids.length-cap,more:true})}});
  const W=640,H=520,cx=W/2,cy=H/2,R1=Math.min(200,70+nodes.length*9);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="group" aria-label="Link graph around ${esc(lab(c))}"><defs><pattern id="hat2" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${C['state-unknown']}" stroke-width="1.5"/></pattern></defs>`;
  const pos=nodes.map((n,i)=>{const a=-Math.PI/2+i/Math.max(1,nodes.length)*Math.PI*2;const rr=nodes.length>14&&i%2?R1+34:R1;return [cx+rr*Math.cos(a)*1.28,cy+rr*Math.sin(a)*.95]});
  nodes.forEach((n,i)=>{const [x,y]=pos[i];const inf=['inference','hypothesis'].includes(n.g.e.cls);const w=1+Math.min(4,Math.log2(1+(n.cluster?n.n:n.g.e.n||1)));
    s+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="${C['line-strong']}" stroke-width="${w}" ${inf?'stroke-dasharray="6 4"':''}><title>${esc(n.g.rel)} (${n.g.dir==='out'?'from selected':'to selected'}) · ${inf?'inferred link':'recorded link'}${n.g.e.n?' · '+n.g.e.n+' evidence id(s)':''}</title></line>`;
    s+=`<text x="${(cx+x)/2}" y="${(cy+y)/2-3}" text-anchor="middle" fill="${C['text-muted']}" font-size="10" font-family="${FONT}" paint-order="stroke" stroke="${C['bg-void']}" stroke-width="3">${esc(n.g.rel)}</text>`});
  nodes.forEach((n,i)=>{const [x,y]=pos[i];
    if(n.cluster)s+=`<g class="node" data-gx="${esc(n.key)}" tabindex="0" role="button" aria-label="Cluster of ${n.n} ${n.g.type} objects, activate to ${n.more?'show':'expand'}"><rect x="${x-26}" y="${y-16}" width="52" height="32" fill="url(#hat2)" stroke="${C['cls-observation']}" stroke-dasharray="3 2"/><rect x="${x-24}" y="${y-14}" width="48" height="28" fill="${C['bg-panel']}" fill-opacity=".85"/><text x="${x}" y="${y-1}" text-anchor="middle" fill="${C['text-primary']}" font-size="11" font-family="${FONT}">${esc(n.g.type.slice(0,9))}</text><text x="${x}" y="${y+11}" text-anchor="middle" fill="${C['text-muted']}" font-size="11" font-family="${FONT}">x${n.n} AGG</text></g>`;
    else{const r=byId[n.id];s+=`<g class="node" data-sel="${r.id}" tabindex="0" role="button" aria-label="${esc(lab(r))}"><title>${esc(lab(r))} · ${esc(CLSN[r.evidence_class])}</title>${shapeSVG(SHAPE[r.type]||'c',x,y,13,r.evidence_class,false)}<text x="${x}" y="${y+28}" text-anchor="middle" fill="${C['text-primary']}" font-size="10.5" font-family="${FONT}" class="sens">${esc(lab(r).replace(/^(Visit|Trip|Sample|Event|Acct|Access|Motion|Health day) /,'').slice(0,22))}</text></g>`}});
  s+=`<g><title>${esc(lab(c))}</title>${shapeSVG(SHAPE[c.type]||'c',cx,cy,22,c.evidence_class,true)}<text x="${cx}" y="${cy+4}" text-anchor="middle" fill="${C['text-primary']}" font-size="11" font-weight="600" font-family="${FONT}">${esc(c.type.slice(0,8))}</text><text x="${cx}" y="${cy+42}" text-anchor="middle" fill="${C.accent}" font-size="12" font-family="${FONT}" class="sens">${esc(lab(c).slice(0,28))}</text></g></svg>`;
  return `<div class="panel"><h2>Link graph · 1 hop around the selection</h2>
   <div class="note">Showing neighbours of one object, <b>not</b> the whole graph. Hop depth 1. Click a neighbour to re-centre (expand one more hop); hatched boxes are clusters (aggregate counts), click to expand. Dashed edge = inferred link; thickness = evidence count. Layout is deterministic.</div>
   <div class="svgbox">${s}</div>
   <div class="legend"><span>shape = type (circle place / hexagon app / square visit / diamond trip / octagon finding / triangle domain / bar aggregate)</span><span>outline = class (solid obs, filled event, dashed hypothesis, double inference)</span></div></div>
  <div class="panel"><h3>Neighbours as a table (text alternative)</h3><div class="tscroll"><table><tr><th>relation</th><th>direction</th><th>type</th><th class="num">count</th><th>examples</th></tr>${gl.map(g=>`<tr><td class="mono">${esc(g.rel)}</td><td>${g.dir==='out'?'from selected':'to selected'}</td><td>${esc(g.type)}</td><td class="num">${g.ids.length}</td><td>${g.ids.slice(0,3).map(i=>chip(i)).join('')}</td></tr>`).join('')}</table></div></div>`;
}

// ---------- investigation ----------
function verdict(f){const st=f.statistic||{};
  if(f.finding_kind==='correlation'&&st.ci95_approx){const [lo,hi]=st.ci95_approx;return lo<=0&&hi>=0?{c:'inc',t:'INCONCLUSIVE',d:'The interval includes zero. Weak association, not distinguishable from no association in this window. A valid result.'}:{c:'desc',t:'INTERVAL EXCLUDES ZERO',d:'Still a correlation, not causation.'}}
  if(f.finding_kind==='null_or_insufficient')return {c:'ins',t:'INSUFFICIENT DATA · NO CONCLUSION',d:`Groups ${st.n_groups.join(' vs ')} are below the minimum of ${st.min_n_rule} per group. Absence of a detected difference is not evidence of no effect. A valid, finished outcome.`};
  if(f.finding_kind==='hypothesis')return {c:'hyp',t:'UNTESTED HYPOTHESIS',d:'Awaiting evidence. Not evidence of anything.'};
  return {c:'desc',t:'DESCRIPTIVE PATTERN (not a test)',d:'Counts of records in the window; no inferential test is attached.'}}
function invPlot(f){const st=f.statistic||{};const W=560;
  if(f.finding_kind==='correlation'&&st.ci95_approx){const x=v=>30+(v+1)/2*(W-60);const [lo,hi]=st.ci95_approx;
    return `<svg class="invplot" viewBox="0 0 ${W} 110" role="img" aria-label="Spearman rho ${st.value.toFixed(2)} with interval ${lo} to ${hi}, crossing zero"><rect x="${x(lo)}" y="26" width="${x(hi)-x(lo)}" height="30" fill="${C['cls-inference']}" fill-opacity=".18" stroke="${C['cls-inference']}"/>
    <line x1="${x(0)}" y1="14" x2="${x(0)}" y2="70" stroke="${C['text-primary']}" stroke-dasharray="4 3"/><text x="${x(0)+4}" y="22" fill="${C['text-primary']}" font-size="11" font-family="${FONT}">0 = no association</text>
    <line x1="${x(lo)}" y1="41" x2="${x(hi)}" y2="41" stroke="${C['cls-inference']}" stroke-width="2"/><line x1="${x(lo)}" y1="32" x2="${x(lo)}" y2="50" stroke="${C['cls-inference']}" stroke-width="2"/><line x1="${x(hi)}" y1="32" x2="${x(hi)}" y2="50" stroke="${C['cls-inference']}" stroke-width="2"/>
    <circle cx="${x(st.value)}" cy="41" r="6" fill="${C['bg-void']}" stroke="${C['cls-inference']}" stroke-width="3"/>
    <line x1="30" y1="76" x2="${W-30}" y2="76" stroke="${C['line-strong']}"/>${[-1,-.5,0,.5,1].map(v=>`<line x1="${x(v)}" y1="76" x2="${x(v)}" y2="81" stroke="${C['line-strong']}"/><text x="${x(v)}" y="95" text-anchor="middle" fill="${C['text-muted']}" font-size="11" font-family="${FONT}">${v}</text>`).join('')}
    <text x="${x(st.value)}" y="18" text-anchor="middle" fill="${C['cls-inference']}" font-size="11" font-family="${FONT}">rho ${st.value.toFixed(2)}</text>
    <text x="${x(lo)}" y="66" text-anchor="middle" fill="${C['text-muted']}" font-size="10.5" font-family="${FONT}">${lo}</text><text x="${x(hi)}" y="66" text-anchor="middle" fill="${C['text-muted']}" font-size="10.5" font-family="${FONT}">${hi}</text></svg>`}
  if(f.finding_kind==='null_or_insufficient'){const g=st.n_groups,mn=st.min_n_rule,mx=Math.max(mn,...g)+3;const bx=n=>30+n/mx*(W-60);
    return `<svg class="invplot" viewBox="0 0 ${W} 110" role="img" aria-label="Group sizes ${g.join(' and ')} against minimum ${mn}">${g.map((n,i)=>`<rect x="30" y="${14+i*30}" width="${bx(n)-30}" height="20" fill="${C['cls-observation']}" fill-opacity=".3" stroke="${C['cls-observation']}"/><text x="${bx(n)+6}" y="${29+i*30}" fill="${C['text-primary']}" font-size="12" font-family="${FONT}">n = ${n}</text>`).join('')}
    <line x1="${bx(mn)}" y1="6" x2="${bx(mn)}" y2="80" stroke="${C['cls-hypothesis']}" stroke-dasharray="4 3" stroke-width="2"/><text x="${bx(mn)}" y="98" text-anchor="middle" fill="${C['cls-hypothesis']}" font-size="11" font-family="${FONT}">minimum ${mn} per group</text></svg>`}
  if(st.value!=null&&st.n!=null)return `<svg class="invplot" viewBox="0 0 ${W} 80" role="img" aria-label="Share ${st.value} of n ${st.n}, interval not reported"><rect x="30" y="14" width="${W-60}" height="22" fill="url(#hat3)" stroke="${C['state-unknown']}"/><defs><pattern id="hat3" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${C['state-unknown']}" stroke-width="1.5"/></pattern></defs><rect x="30" y="14" width="${(W-60)*st.value}" height="22" fill="${C['cls-inference']}" fill-opacity=".4" stroke="${C['cls-inference']}"/><text x="34" y="52" fill="${C['text-primary']}" font-size="12" font-family="${FONT}">share ${st.value} (n = ${st.n}) · interval: UNKNOWN (not reported by method v${f.method_version})</text><text x="30" y="70" fill="${C['text-muted']}" font-size="11" font-family="${FONT}">0</text><text x="${W-30}" y="70" text-anchor="end" fill="${C['text-muted']}" font-size="11" font-family="${FONT}">1</text></svg>`;
  return '';}

// ---------- control ----------
function cascade(src){
  const base=R.filter(r=>r.source_id===src&&r.type!=='Source');const del=new Set(base.map(r=>r.id));const casc=[];const seen=new Set();
  let ch=true,guard=0;
  const deps=r=>r.type==='Link'?[r.from,r.to]:r.type==='Finding'?[...(r.supporting_evidence_ids||[]),...(r.contradicting_evidence_ids||[])]:r.type==='Correction'?[r.target_id]:[];
  while(ch&&guard++<6){ch=false;R.forEach(r=>{if(del.has(r.id)||seen.has(r.id))return;
    if(r.type==='Link'){if(del.has(r.from)||del.has(r.to)){casc.push({r,k:'invalidated'});seen.add(r.id);del.add(r.id);ch=true}}
    else if(r.type==='Finding'){const d=deps(r).filter(i=>del.has(i)),tot=deps(r).length;
      if(r.evidence_class==='hypothesis'&&r.motivated_by_ids&&r.motivated_by_ids.some(i=>seen.has(i)||del.has(i))){casc.push({r,k:'re-review',note:'motivating finding is affected'});seen.add(r.id);ch=true}
      else if(tot&&d.length===tot){casc.push({r,k:'invalidated',note:'all evidence removed'});seen.add(r.id);del.add(r.id);ch=true}
      else if(d.length){casc.push({r,k:'recompute',note:`${d.length} of ${tot} evidence ids removed`});seen.add(r.id);ch=true}}
    else if(r.type==='Correction'){if(del.has(r.target_id)||seen.has(r.target_id)){casc.push({r,k:'orphaned',note:'participant-authored; kept for the participant to decide'});seen.add(r.id)}}})}
  return {base,casc};
}

  const mod=e.ctrlKey||e.metaKey;
  if(mod&&!e.shiftKey&&e.key.toLowerCase()==='k'){e.preventDefault();if($('#palette').hidden)openPalette();else closeModal();return}
  if(e.key==='Escape'){if(!$('#palette').hidden||!$('#help').hidden){closeModal();return}if(S.sel&&!/input|select|textarea/i.test(e.target.tagName)){S.sel=null;if(['dossier','graph'].includes(S.screen))renderView();renderCtx();if(S.screen==='map'){drawMap();renderMapChips()}if(S.screen==='timeline')tlDraw()}return}
  if(!$('#palette').hidden||!$('#help').hidden)return;
  if(mod&&e.shiftKey&&e.key.toLowerCase()==='h'){e.preventDefault();S.blur=!S.blur;render();return}
  if(mod&&e.shiftKey&&e.key.toLowerCase()==='p'){e.preventDefault();doAction('pauseall');return}
  if(mod||e.altKey||/input|select|textarea/i.test(e.target.tagName))return;
  const k=e.key;
  if(Date.now()<gPending){gPending=0;const s=GKEYS[k.toLowerCase()];if(s){e.preventDefault();setScreen(s)}return}
  if(k>='1'&&k<='6'){setLens(+k);return}
  if(k==='g'||k==='G'){gPending=Date.now()+1200;return}
  if(k==='['){setT(S.t-1440);return}if(k===']'){setT(S.t+1440);return}
  if(k==='?'){openHelp();return}
  if(k===' '&&S.screen==='map'&&e.target===document.body){e.preventDefault();doAction('play');return}
  if(k==='Enter'&&S.sel&&e.target===document.body){if(e.shiftKey)addScratch(S.sel);else{setScreen('dossier')}return}
  if((k==='p'||k==='P')&&S.sel){setScreen('dossier');return}
});

if(!location.hash)history.replaceState(null,'','#map');
applyHash();
})();
</script>
