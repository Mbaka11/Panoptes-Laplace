# Sensor Probe project definition (XcodeGen). The .xcodeproj is generated, not committed.
# Provisional, D-044. No capability, entitlement or permission string is declared yet:
# each module adds its own, after verification against the installed SDK (sensor-probe-spec.md).
name: SensorProbe
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
options:
  bundleIdPrefix: com.example.panoptes   # unused for the id itself: see Config/Base.xcconfig and the git-ignored Config/Local.xcconfig
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  SensorProbe:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Sensor Probe
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        # LOC-01 (when-in-use only). Keys verified in the iOS 27.2 SDK header CLLocationManager.h.
        # Always-and-when-in-use key and UIBackgroundModes are intentionally NOT declared (later step).
        NSLocationWhenInUseUsageDescription: "La sonde Panoptes enregistre la position de ce téléphone lorsque l'application est ouverte, pour évaluer la qualité de la collecte de position. Dans cette version d'essai, les relevés restent en mémoire sur ce téléphone et ne sont ni exportés ni envoyés."
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
